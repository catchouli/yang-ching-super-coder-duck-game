<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DUCK GAME</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: linear-gradient(#87ceeb, #b8e3ff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive;
    overflow: hidden;
  }
  #title, #subtitle {
    font-weight: bold;
    letter-spacing: 2px;
    padding: 4px 10px;
    user-select: none;
  }
  #title {
    font-size: 36px;
    animation: none;
  }
  #subtitle {
    font-size: 30px;
    color: #fff;
    animation: none;
  }
  #title span, #subtitle span {
    display: inline-block;
    animation: floaty 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i) * -0.18s);
    text-shadow: 0 4px 0 rgba(0,0,0,0.18), 0 0 14px rgba(255,255,255,0.55);
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(2px) rotate(-4deg) scale(0.96); }
    50% { transform: translateY(-9px) rotate(4deg) scale(1.06); }
  }
  #game {
    border: 6px solid #5c8a3a;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    max-width: 96vw;
    max-height: 78vh;
  }
</style>
</head>
<body>
<div id="title">YANG CHING - SUPER CODER</div>
<canvas id="game" width="800" height="600"></canvas>
<div id="subtitle">DUCK GAME</div>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const PELLET_COUNT = 5;
const LOG_COUNT = 4;
const WALK_SPEED = 120;
const EXCITED_SPEED = 175;

let state, duck, pellets, logs, flowers, particles, clouds, butterfly;
let eggs = [];
let ducklings = [];
let groundHat = null;
let hatTimer = 10;
let hatCollection = 0;
let visitors = [];
let visitorTimer = 12;
let levelBanner = 0;
let sparkleTick = 0;
let shake = 0;
let stage = 1;
let goal = 15;
let clearTimer = 0;
let weather = [];
let elon = null;
let elonTimer = 60;
let fireworks = [];
let fireworkTimer = 14;
let flocks = [];
let flockTimer = 18;
let growTimer = 25;
let wizard = null;
let wizardTimer = 20;
let resetArm = 0;

let mouseX = 400;
let mouseY = 300;

let gooseTimer = 50;
let maisy = null;
let maisyTimer = 70;
let carrot = null;
let carrotTimer = 25;

let trees = [];

let fineMsg = 0;

let pondCooldown = 0;
let bees = [];

let frogs = [];

let love = 0;

const LOVE_MAX = 20;
let matrixMode = 0;
let matrixCols = null;

let keanuGone = false;

let teslaPitch = 0;
let teslaX = 0;
let teslaY = 0;
let bubbleQueue = [];
let track = null;
let rideDist = 0;
let rideLaps = 0;
let score = 0;
let muted = false;
let time = 0;
let lastTime = 0;
let lastAction = "";

const EAT_WORDS = ["QUACK!", "YUM!", "NOM NOM!", "QUACK QUACK!", "TASTY!"];
const TRIP_WORDS = ["WHOOPSIE!", "OOF!", "QUACK?!", "BONK!", "WOBBLY!"];
const SPOT_WORDS = ["OHH!", "PELLET!", "FOOD!", "YAY!"];

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function pondInfo() {
  return { x: 120, y: 515, rx: 95, ry: 42 };
}

function nearPond(x, y, dist) {
  const p = pondInfo();
  const dx = (x - p.x) / (p.rx + dist);
  const dy = (y - p.y) / (p.ry + dist);
  return dx * dx + dy * dy < 1;
}

function logCollide(x, y, log, pad) {
  const dx = (x - log.x) / (log.rx + pad);
  const dy = (y - log.y) / (log.ry + pad);
  return dx * dx + dy * dy <= 1;
}

function makeButterfly() {
  return { x: rand(200, W - 200), y: rand(120, H - 200), ang: rand(0, Math.PI * 2), flee: 0 };
}

function placeLogs() {
  logs = [];
  const count = 5;
  const xs = [];
  for (let i = 0; i < count; i++) {
    let x = rand(120, W - 120);
    for (let t = 0; t < 80; t++) {
      x = rand(120, W - 120);
      if (xs.every(o => Math.abs(o - x) > 105)) break;
    }
    xs.push(x);
    logs.push({
      x,
      y: -70 + i * ((H + 180) / count) + rand(-40, 40),
      rx: rand(48, 64),
      ry: 26,
      v: rand(11, 20),
      roll: rand(0, 6.28),
      tilt: rand(-0.06, 0.06),
      rings: Math.floor(rand(2, 5))
    });
  }
}

function updateLogs(dt) {
  for (const log of logs) {
    log.y += log.v * dt;
    log.roll += (log.v * dt) / 22;
    if (log.y - log.ry > H + 40) {
      log.y = -log.ry - rand(30, 160);
      let x = rand(120, W - 120);
      for (let t = 0; t < 30 && Math.abs(x - duck.x) < 140; t++) {
        x = rand(120, W - 120);
      }
      log.x = x;
      log.v = rand(11, 20);
      log.roll = rand(0, 6.28);
      log.tilt = rand(-0.06, 0.06);
    }
  }
}

function spawnPellet() {
  for (let tries = 0; tries < 300; tries++) {
    const x = rand(60, W - 60);
    const y = rand(80, H - 60);
    if (nearPond(x, y, 20)) continue;
    if (Math.hypot(x - duck.x, y - duck.y) < 90) continue;
    let bad = false;
    for (const log of logs) {
      if (logCollide(x, y, log, 35)) bad = true;
    }
    for (const p of pellets) {
      if (Math.hypot(x - p.x, y - p.y) < 50) bad = true;
    }
    if (bad) continue;
    return { x, y, wobble: rand(0, Math.PI * 2) };
  }
  return { x: rand(60, W - 60), y: rand(80, H - 60), wobble: 0 };
}

function makeClouds() {
  clouds = [];
  for (let i = 0; i < 3; i++) {
    clouds.push({ x: rand(0, W), y: rand(40, 140), v: rand(8, 20), s: rand(0.8, 1.4) });
  }
}

function findFlowerSpot() {
  for (let t = 0; t < 100; t++) {
    const x = rand(50, W - 50);
    const y = rand(170, H - 30);
    if (nearPond(x, y, 12)) continue;
    let bad = false;
    for (const log of logs) {
      if (logCollide(x, y, log, 10)) bad = true;
    }
    if (bad) continue;
    return { x, y };
  }
  return { x: rand(50, W - 50), y: rand(170, H - 30) };
}

function makeFlowers() {
  flowers = [];
  for (let i = 0; i < 8; i++) {
    const spot = findFlowerSpot();
    flowers.push({ x: spot.x, y: spot.y, petal: pick(["#ff8fb1", "#ffffff", "#ffd6e8", "#d9b3ff"]), grow: rand(0.2, 1), puff: 0, phase: rand(0, 6.28) });
  }
}

function makeBees() {
  bees = [];
  for (let i = 0; i < 2; i++) {
    bees.push({ x: rand(100, W - 100), y: rand(120, H - 150), tx: rand(100, W - 100), ty: rand(120, H - 150), state: "wander", timer: rand(1, 3), target: null, wob: rand(0, 6.28), face: 1 });
  }
}

function makeFrogs() {
  frogs = [];
  for (let i = 0; i < 2; i++) {
    const spot = i === 0 ? { x: pondInfo().x + 45, y: pondInfo().y - 15 } : frogSpot();
    frogs.push({ x: spot.x, y: spot.y, state: "sit", timer: rand(1, 3), fromX: spot.x, fromY: spot.y, toX: spot.x, toY: spot.y, hopT: 1, blink: 0, blinkTimer: rand(2, 5), croakTimer: rand(2, 6), croak: 0, dir: 1, pad: i === 0 });
  }
}

function frogSpot() {
  const p = pondInfo();
  for (let t = 0; t < 120; t++) {
    const a = rand(0, Math.PI * 2);
    const x = Math.max(30, Math.min(W - 30, p.x + Math.cos(a) * rand(105, 155)));
    const y = Math.max(80, Math.min(H - 25, p.y + Math.sin(a) * rand(60, 90)));
    if (!nearPond(x, y, 6)) return { x, y };
  }
  return { x: p.x + 180, y: p.y - 60 };
}

function playRibbit() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(180, t0);
  osc.frequency.exponentialRampToValueAtTime(115, t0 + 0.13);
  gain.gain.setValueAtTime(0.06, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.18);
}

function updateFrogs(dt) {
  for (const f of frogs) {
    f.blinkTimer -= dt;
    if (f.blinkTimer <= 0) {
      f.blink = 0.12;
      f.blinkTimer = rand(2, 5);
    }
    if (f.blink > 0) f.blink -= dt;
    f.croakTimer -= dt;
    if (f.croakTimer <= 0 && f.state === "sit") {
      f.croakTimer = rand(3, 7);
      f.croak = 0.8;
      particles.push({ type: "word", text: "ribbit..", x: f.x + rand(-6, 6), y: f.y - 30, life: 1.1 });
      playRibbit();
    }
    if (f.croak > 0) f.croak -= dt;
    if (f.state === "sit") {
      f.timer -= dt;
      if (ecoRush > 0 && bulldozer) f.timer = Math.min(f.timer, 0.12);
      if (f.timer <= 0) {
        let spot;
        if (ecoRush > 0 && bulldozer) {
          spot = { x: Math.max(30, Math.min(W - 30, bulldozer.x + rand(-60, 20))), y: Math.max(80, Math.min(H - 25, bulldozer.y + rand(-15, 35))) };
        } else if (Math.random() < 0.3) {
          spot = { x: f.x, y: f.y };
        } else if (f.pad && Math.random() < 0.4) {
          spot = { x: pondInfo().x + 45, y: pondInfo().y - 15 };
        } else {
          spot = frogSpot();
        }
        f.fromX = f.x;
        f.fromY = f.y;
        f.toX = spot.x;
        f.toY = spot.y;
        f.hopT = 0;
        f.state = "hop";
        f.dir = f.toX >= f.x ? 1 : -1;
      }
    } else {
      f.hopT += dt / 0.55;
      if (f.hopT >= 1) {
        f.hopT = 1;
        f.x = f.toX;
        f.y = f.toY;
        f.state = "sit";
        f.timer = rand(1.2, 2.8);
      }
    }
  }
}

function drawFrogs() {
  for (const f of frogs) {
    const jumping = f.state === "hop";
    let jy = 0;
    let squash = 1;
    if (jumping) {
      jy = -Math.sin(f.hopT * Math.PI) * 22;
      squash = 1 + Math.sin(f.hopT * Math.PI) * 0.18;
    } else {
      squash = 1 + Math.sin(time * 3 + f.x) * 0.04;
    }
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    ctx.beginPath();
    ctx.ellipse(f.x, f.y + 7, 16, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(f.x, f.y + jy);
    ctx.scale(f.dir * 1.55, 1.55);
    ctx.fillStyle = "#5fae4e";
    ctx.beginPath();
    ctx.ellipse(0, -5, 11 / squash, 8 * squash, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#4a8a3c";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#d8f0c8";
    ctx.beginPath();
    ctx.ellipse(0, -1.5, 7.5, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#5fae4e";
    ctx.beginPath();
    ctx.arc(-5, -14, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(5, -14, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(-5, -14, 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(5, -14, 2.6, 0, Math.PI * 2);
    ctx.fill();
    if (f.blink > 0) {
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(-6.5, -14);
      ctx.lineTo(-3.5, -14);
      ctx.moveTo(3.5, -14);
      ctx.lineTo(6.5, -14);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath();
      ctx.arc(-4.5, -14, 1.3, 0, Math.PI * 2);
      ctx.arc(5.5, -14, 1.3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = "#3d7a30";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(2, -7);
    ctx.lineTo(7, -7.5);
    ctx.stroke();
    if (f.croak > 0) {
      ctx.fillStyle = "#fbf3c0";
      ctx.beginPath();
      ctx.arc(4, -3, 2.5 + Math.abs(Math.sin(time * 18)) * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#5fae4e";
    ctx.beginPath();
    ctx.ellipse(-6, 2, 3, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(6, 2, 3, 1.8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const TIERS = [
  { name: "classic", minLvl: 1, fill: "#fff8ec", spot: "#ecdfc2", shade: "#d9c9a8", twins: false, fast: 0 },
  { name: "blue", minLvl: 2, fill: "#a8d8ea", spot: "#7fb8d4", shade: "#6fa8c9", twins: false, fast: 1.5 },
  { name: "pink", minLvl: 3, fill: "#ffc2d4", spot: "#f191ad", shade: "#e08aa8", twins: true, fast: 0 },
  { name: "purple", minLvl: 4, fill: "#c3b1e1", spot: "#9d86c9", shade: "#9d86c9", twins: true, fast: 1.5 },
  { name: "rainbow", minLvl: 5, fill: "#fff", spot: null, shade: "#e8890c", twins: true, fast: 2.5 }
];
const SKINS = {
  classic: { body: "#ffe873", shade: "#d9b616", wing: "#f7d24f" },
  blue: { body: "#a8d8ea", shade: "#6fa8c9", wing: "#8fc4dc" },
  pink: { body: "#ffc2d4", shade: "#e08aa8", wing: "#f7a8c0" },
  purple: { body: "#c3b1e1", shade: "#9d86c9", wing: "#b3a0d9" }
};
const XP_NEED = [8, 20, 40, 70, 110];
let save = { xp: 0, level: 1 };
try {
  const savedData = localStorage.getItem("duckieSave");
  if (savedData) save = Object.assign({ xp: 0, level: 1 }, JSON.parse(savedData));
} catch (err) {}
function persistSave() {
  try {
    localStorage.setItem("duckieSave", JSON.stringify(save));
  } catch (err) {}
}
function xpNeed() {
  return save.level >= 6 ? 0 : XP_NEED[save.level - 1];
}
function gainXP(n) {
  save.xp += n;
  while (save.level < 6 && save.xp >= XP_NEED[save.level - 1]) {
    save.xp -= XP_NEED[save.level - 1];
    save.level++;
    celebrateLevel();
  }
  persistSave();
}
function pickTier() {
  const unlocked = TIERS.filter(t => save.level >= t.minLvl);
  return Math.random() < 0.6 ? unlocked[unlocked.length - 1] : pick(unlocked);
}
function walkSpeed() {
  return (WALK_SPEED + (save.level - 1) * 6) * (1 + (love / LOVE_MAX) * 0.25);
}
function excitedSpeed() {
  return (EXCITED_SPEED + (save.level - 1) * 8) * (1 + (love / LOVE_MAX) * 0.25);
}
function playLevelUp() {
  if (muted || !actx) return;
  [392, 523, 659, 784].forEach((f, i) => {
    const t0 = actx.currentTime + i * 0.11;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.14, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.35);
  });
}
function celebrateLevel() {
  levelBanner = 2.6;
  duck.hop = 0.5;
  duck.happyTimer = 1.5;
  say("LEVEL UP!");
  playLevelUp();
  for (let i = 0; i < 10; i++) {
    particles.push({ type: "heart", x: duck.x + rand(-30, 30), y: duck.y - 30 + rand(-20, 10), life: rand(1, 1.5), size: rand(0.9, 1.6) });
  }
  for (let i = 0; i < 14; i++) {
    particles.push({
      type: "spark",
      x: duck.x + rand(-40, 40),
      y: duck.y - 30 + rand(-30, 20),
      vx: rand(-90, 90),
      vy: rand(-140, -30),
      life: rand(0.4, 0.9),
      color: pick(["#ffd93d", "#fff8d0", "#ff8fb1", "#a8d8ea"]),
      size: rand(2, 4.5)
    });
  }
}

function makeDuck() {
  return {
    x: W / 2,
    y: H / 2,
    facing: 1,
    waddlePhase: 0,
    moving: false,
    tripping: 0,
    tripCooldown: 0,
    dizzyAngle: 0,

    bubbleTimer: 0,

    blinking: 0,

    drinkTick: 0,

    rideKind: null,

    flandY: 0,

  };
}

function reset() {
  score = 0;
  pellets = [];
  particles = [];
  eggs = [];
  ducklings = [];
  groundHat = null;
  hatTimer = 10;
  hatCollection = 0;
  visitors = [];
  visitorTimer = rand(10, 20);
  stage = 1;
  goal = 15;
  elon = null;
  elonTimer = rand(45, 90);
  fireworks = [];
  fireworkTimer = rand(12, 24);
  flocks = [];
  flockTimer = rand(14, 26);
  growTimer = rand(18, 30);
  wizard = null;
  wizardTimer = rand(15, 30);
  goose = null;
  gooseTimer = rand(40, 80);
  maisy = null;
  maisyTimer = rand(60, 100);
  carrot = null;
  carrotTimer = rand(15, 35);
  pondHits = 0;
  pondCooldown = 0;
  dad = null;
  dadTimer = rand(150, 260);
  gnome = null;
  gnomeTimer = rand(40, 80);
  ecoMsg = 0;
  bulldozer = null;
  dozerTimer = rand(40, 70);

  makeWeather();
  duck = makeDuck();
  track = buildTrack();

  makeClouds();
  makeFlowers();
  makeBees();
  makeFrogs();

  for (let i = 0; i < PELLET_COUNT; i++) {
    pellets.push(spawnPellet());
  }

  state = "play";
}

function say(text, dur) {
  duck.bubbleText = text;
  duck.bubbleTimer = dur || 1.2;
}

function actxInit() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (err) {
      actx = null;
    }
  }
  if (actx && actx.state === "suspended") actx.resume();
}

let actx = null;

function playQuack() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const blip = (start, from, to, dur, vol) => {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    const filt = actx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.value = 1000;
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(from, start);
    osc.frequency.exponentialRampToValueAtTime(to, start + dur);
    gain.gain.setValueAtTime(0, start);
    gain.gain.linearRampToValueAtTime(vol, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
    osc.connect(filt).connect(gain).connect(actx.destination);
    osc.start(start);
    osc.stop(start + dur + 0.05);
  };
  blip(t0, 330, 170, 0.13, 0.18);
  blip(t0 + 0.13, 290, 150, 0.1, 0.14);
}

function playBonk() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(110, t0);
  osc.frequency.exponentialRampToValueAtTime(45, t0 + 0.25);
  gain.gain.setValueAtTime(0.25, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.35);
  const t1 = t0 + 0.2;
  const osc2 = actx.createOscillator();
  const gain2 = actx.createGain();
  osc2.type = "sawtooth";
  osc2.frequency.setValueAtTime(240, t1);
  osc2.frequency.exponentialRampToValueAtTime(80, t1 + 0.35);
  gain2.gain.setValueAtTime(0.1, t1);
  gain2.gain.exponentialRampToValueAtTime(0.001, t1 + 0.4);
  osc2.connect(gain2).connect(actx.destination);
  osc2.start(t1);
  osc2.stop(t1 + 0.45);
}

function playWin() {
  if (muted || !actx) return;
  const notes = [523, 659, 784, 1047, 784, 1047];
  notes.forEach((f, i) => {
    const t0 = actx.currentTime + i * 0.13;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.15, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.3);
  });
}

function moveToward(tx, ty, speed, dt) {
  const dx = tx - duck.x;
  const dy = ty - duck.y;
  const d = Math.hypot(dx, dy);
  if (d < 8) return true;
  duck.x += (dx / d) * speed * dt;
  duck.y += (dy / d) * speed * dt;
  if (Math.abs(dx) > 2) duck.facing = dx > 0 ? 1 : -1;
  duck.waddlePhase += dt * 11;
  duck.moving = true;
  return false;
}

function clampDuck() {
  duck.x = Math.max(34, Math.min(W - 34, duck.x));
  duck.y = Math.max(60, Math.min(H - 34, duck.y));
}

function startSeek() {
  let best = null;
  let bestD = Infinity;
  for (const p of pellets) {
    const d = Math.hypot(p.x - duck.x, p.y - duck.y);
    if (d < bestD) {
      bestD = d;
      best = p;
    }
  }
  if (!best) {
    startWander();
    return;
  }
  duck.brain = "seek";
  duck.target = { x: best.x, y: best.y };
  if (Math.random() < 0.3) say(pick(SPOT_WORDS), 1);
  lastAction = "seek";
}

function startWander() {
  duck.brain = "wander";
  duck.target = { x: rand(60, W - 60), y: rand(90, H - 60) };
  lastAction = "wander";
}

function startPond() {
  const p = pondInfo();
  const a = rand(0, Math.PI * 2);
  duck.brain = "pond";
  duck.target = {
    x: Math.max(40, Math.min(W - 40, p.x + Math.cos(a) * (p.rx + 30))),
    y: Math.max(60, Math.min(H - 40, p.y + Math.sin(a) * (p.ry + 25)))
  };
  lastAction = "pond";
}

function startDrink() {
  duck.brain = "drink";
  duck.stateTimer = 2.2;
  duck.drinkTick = 0;
  say("glug glug!", 1.4);
  lastAction = "drink";
}

function startNap() {
  duck.brain = "nap";
  duck.stateTimer = rand(4, 7);
  duck.napTick = 0.6;
  lastAction = "nap";
}

function startChase() {
  duck.brain = "chase";
  duck.stateTimer = 4;
  say("!!", 0.8);
  lastAction = "chase";
}

function startIdle() {
  duck.brain = "idle";
  duck.stateTimer = rand(1, 2.5);
  if (Math.random() < 0.4) {
    say("QUACK!");
    playQuack();
  }
  if (Math.random() < 0.5) duck.facing *= -1;
  lastAction = "idle";
}

function decide() {
  duck.moving = false;
  if (groundHat) {
    startCollect();
    return;
  }
  const r = Math.random();
  if (r < 0.4) {
    startSeek();
  } else if (r < 0.52) {
    startPond();
  } else if (r < 0.6) {
    if (lastAction === "nap") startWander();
    else startNap();
  } else if (r < 0.7) {
    startChase();
  } else if (r < 0.8) {
    if (lastAction === "coaster") startWander();
    else startRide();
  } else if (r < 0.93) {
    startWander();
  } else {
    startIdle();
  }
}

function tripOverLog() {
  duck.tripping = 1;
  duck.tripCooldown = 2.2;
  duck.brain = "tripped";
  say(pick(TRIP_WORDS));
  playBonk();
  for (let i = 0; i < 5; i++) {
    particles.push({
      type: "spark",
      x: duck.x,
      y: duck.y - 10,
      vx: rand(-70, 70),
      vy: rand(-90, -20),
      life: 0.5,
      color: "#ffe066",
      size: rand(3, 5)
    });
  }
}

function playPeep() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  const filt = actx.createBiquadFilter();
  filt.type = "lowpass";
  filt.frequency.value = 1400;
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(700, t0);
  osc.frequency.exponentialRampToValueAtTime(430, t0 + 0.09);
  gain.gain.setValueAtTime(0.09, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.12);
  osc.connect(filt).connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.18);
}

function playPlop() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(260, t0);
  osc.frequency.exponentialRampToValueAtTime(110, t0 + 0.14);
  gain.gain.setValueAtTime(0.14, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.2);
}

function layEgg() {
  const golden = Math.random() < 0.25;
  const tier = pickTier();
  eggs.push({
    x: Math.max(30, Math.min(W - 30, duck.x - duck.facing * 30)),
    y: Math.max(50, Math.min(H - 40, duck.y + 12)),
    timer: 0,
    hatching: false,
    golden,
    tier: tier.name
  });
  duck.hop = 0.35;
  say(golden ? "GOLDEN EGG!" : tier.name === "rainbow" ? "RAINBOW EGG!!" : "EGG!");
  playPlop();
}

function hatchDuckling(egg, ox) {
  ducklings.push({
    x: egg.x + (ox || 0),
    y: egg.y,
    facing: 1,
    waddlePhase: rand(0, Math.PI * 2),
    moving: false,
    peepTimer: rand(2, 5),
    skin: egg.tier || "classic"
  });
  particles.push({ type: "word", text: "peep!", x: egg.x + (ox || 0), y: egg.y - 30, life: 1.2 });
}

function updateEggs(dt) {
  for (let i = eggs.length - 1; i >= 0; i--) {
    const egg = eggs[i];
    const tier = TIERS.find(t => t.name === egg.tier) || TIERS[0];
    egg.timer += dt;
    if (!egg.hatching && egg.timer >= 5 - tier.fast) {
      egg.hatching = true;
      egg.timer = 0;
    }
    if (egg.hatching && egg.timer >= 1.5) {
      const count = 1 + (tier.twins ? 1 : 0) + (egg.golden ? 1 : 0);
      const offs = count === 1 ? [0] : count === 2 ? [-16, 8] : [-24, 0, 14];
      for (const ox of offs) hatchDuckling(egg, ox);
      if (count >= 3) particles.push({ type: "word", text: "TRIPLE!!", x: egg.x, y: egg.y - 52, life: 1.4 });
      else if (count === 2) particles.push({ type: "word", text: "TWINS!", x: egg.x, y: egg.y - 52, life: 1.4 });
      playPeep();
      playPeep();
      for (let j = 0; j < 8 + count * 3; j++) {
        particles.push({
          type: "spark",
          x: egg.x,
          y: egg.y,
          vx: rand(-80, 80),
          vy: rand(-100, -10),
          life: rand(0.3, 0.6),
          color: pick(["#fff8ec", "#ffe873", "#fff"]),
          size: rand(2, 4)
        });
      }
      eggs.splice(i, 1);
    }
  }
}

function updateDucklings(dt) {
  for (let i = 0; i < ducklings.length; i++) {
    const dl = ducklings[i];
    const leader = i === 0 ? duck : ducklings[i - 1];
    const dx = leader.x - dl.x;
    const dy = leader.y - dl.y;
    const d = Math.hypot(dx, dy);
    dl.moving = false;
    if (d > 34) {
      const speed = Math.min(210, 70 + (d - 34) * 3.5);
      dl.x += (dx / d) * speed * dt;
      dl.y += (dy / d) * speed * dt;
      if (Math.abs(dx) > 2) dl.facing = dx > 0 ? 1 : -1;
      dl.waddlePhase += dt * 13;
      dl.moving = true;
    }
    dl.x = Math.max(24, Math.min(W - 24, dl.x));
    dl.y = Math.max(50, Math.min(H - 30, dl.y));
    dl.peepTimer -= dt;
    if (dl.peepTimer <= 0) {
      dl.peepTimer = rand(6, 14);
      if (state === "play") {
        playPeep();
        particles.push({ type: "word", text: "peep!", x: dl.x, y: dl.y - 30, life: 1.2 });
      }
    }
  }
}

function drawEggs() {
  for (const egg of eggs) {
    const tier = TIERS.find(t => t.name === egg.tier) || TIERS[0];
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    ctx.beginPath();
    ctx.ellipse(egg.x, egg.y + 13, 10, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(egg.x, egg.y);
    if (egg.hatching) {
      ctx.translate(rand(-1.5, 1.5), 0);
    } else if (egg.timer % 2.5 < 0.35) {
      ctx.rotate(Math.sin(egg.timer * 40) * 0.09);
    }
    ctx.fillStyle = egg.golden ? "#ffd94d" : tier.name === "rainbow" ? "hsl(" + Math.round((time * 80) % 360) + ", 75%, 72%)" : tier.fill;
    ctx.beginPath();
    ctx.ellipse(0, 0, 10.5, 13.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = egg.golden ? "#d9a616" : tier.shade;
    ctx.lineWidth = 2;
    ctx.stroke();
    if (tier.spot && !egg.golden) {
      ctx.fillStyle = tier.spot;
      ctx.beginPath();
      ctx.arc(-3.5, -3, 2, 0, Math.PI * 2);
      ctx.arc(4, 2, 1.6, 0, Math.PI * 2);
      ctx.arc(-1, 6, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    if (tier.name === "rainbow" && !egg.hatching) {
      ctx.fillStyle = "#fff";
      drawStar(Math.cos(time * 3) * 13, -10, 3.5);
    }
    if (egg.golden) {
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.ellipse(-3.5, -5, 2.5, 4.5, -0.5, 0, Math.PI * 2);
      ctx.fill();
      if (!egg.hatching && (egg.timer % 1) < 0.5) {
        ctx.fillStyle = "#fff8d0";
        drawStar(10, -14, 5);
      }
    }
    if (egg.hatching) {
      ctx.strokeStyle = egg.golden ? "#b8860b" : tier.shade;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(-6, -8);
      ctx.lineTo(-2, -4);
      ctx.lineTo(2, -7);
      ctx.lineTo(5, -2);
      ctx.stroke();
      if (egg.timer > 0.8) {
        ctx.beginPath();
        ctx.moveTo(-7, 3);
        ctx.lineTo(-3, 6);
        ctx.lineTo(1, 3);
        ctx.lineTo(6, 6);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawDucklings() {
  for (const dl of ducklings) {
    const sk = SKINS[dl.skin] || SKINS.classic;
    const rainbow = dl.skin === "rainbow";
    const hue1 = Math.round((time * 70 + dl.waddlePhase * 57) % 360);
    const bodyCol = rainbow ? "hsl(" + hue1 + ", 72%, 66%)" : sk.body;
    const shadeCol = rainbow ? "hsl(" + hue1 + ", 72%, 40%)" : sk.shade;
    const wingCol = rainbow ? "hsl(" + Math.round((hue1 + 40) % 360) + ", 72%, 76%)" : sk.wing;

    const gScale = dl.scale || 0.62;
    const growBob = dl.mode === "grow" ? Math.abs(Math.sin(time * 10)) * 4 : 0;

    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.beginPath();
    ctx.ellipse(dl.x, dl.y + 18, 14 * (gScale / 0.62), 4.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(dl.x, dl.y - growBob);
    if (dl.moving) ctx.rotate(Math.sin(dl.waddlePhase) * 0.14);
    ctx.scale(dl.facing * gScale, gScale);

    const f = dl.moving ? Math.sin(dl.waddlePhase) * 5 : 0;
    ctx.fillStyle = "#ff9f1c";
    ctx.beginPath();
    ctx.ellipse(-5, 26 + f, 6, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(5, 26 - f, 6, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.ellipse(0, 10, 17, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = shadeCol;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = wingCol;
    ctx.beginPath();
    ctx.ellipse(-2, 11, 8, 5.5, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = bodyCol;
    ctx.beginPath();
    ctx.arc(9, -8, 13, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = shadeCol;
    ctx.stroke();

    ctx.strokeStyle = shadeCol;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(4, -20);
    ctx.lineTo(2, -25);
    ctx.moveTo(9, -20);
    ctx.lineTo(10, -26);
    ctx.stroke();

    ctx.fillStyle = "#ff9f1c";
    ctx.beginPath();
    ctx.moveTo(19, -11);
    ctx.lineTo(31, -6);
    ctx.lineTo(19, -2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#d97f0e";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = "rgba(255,130,130,0.45)";
    ctx.beginPath();
    ctx.ellipse(4, 0, 4.5, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();

    if (dl.mode) {
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(13, -11, 2.6, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath();
      ctx.arc(13, -11, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(14.2, -12.2, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function updateDucklings(dt) {
  growTimer -= dt;
  if (growTimer <= 0 && state === "play" && ducklings.length >= 3) {
    growTimer = ducklings.length > 14 ? 2 : rand(20, 35);
    const candidates = ducklings.filter(d => !d.mode);
    if (candidates.length) {
      const lucky = pick(candidates);
      lucky.mode = "grow";
      lucky.growT = 0;
      lucky.scale = 0.62;
    }
  }
  for (let i = ducklings.length - 1; i >= 0; i--) {
    const dl = ducklings[i];
    if (dl.mode === "grow") {
      dl.growT += dt;
      dl.moving = false;
      dl.scale = 0.62 + Math.min(1, dl.growT / 2.2) * 0.5;
      if (dl.growT >= 2.2) {
        dl.mode = "leave";
        playQuack();
        particles.push({ type: "word", text: "QUACK!", x: dl.x, y: dl.y - 40, life: 1.3 });
        for (let j = 0; j < 3; j++) {
          particles.push({ type: "heart", x: dl.x + rand(-12, 12), y: dl.y - 24, life: rand(0.9, 1.3), size: rand(0.8, 1.2) });
        }
        const a = rand(0, Math.PI * 2);
        dl.leaveX = dl.x + Math.cos(a) * 900;
        dl.leaveY = dl.y + Math.sin(a) * 900;
      }
      continue;
    }
    if (dl.mode === "leave") {
      const dx = dl.leaveX - dl.x;
      const dy = dl.leaveY - dl.y;
      const d = Math.hypot(dx, dy) || 1;
      dl.x += (dx / d) * 270 * dt;
      dl.y += (dy / d) * 270 * dt;
      if (Math.abs(dx) > 2) dl.facing = dx > 0 ? 1 : -1;
      dl.waddlePhase += dt * 16;
      dl.moving = true;
      if (dl.x < -70 || dl.x > W + 70 || dl.y < -60 || dl.y > H + 60) {
        ducklings.splice(i, 1);
      }
      continue;
    }
    if (dl.zoomies > 0) {
      dl.zoomies -= dt;
      dl.zt = (dl.zt || 0) - dt;
      if (dl.zt <= 0) {
        dl.zt = 0.22;
        dl.zang = rand(0, Math.PI * 2);
      }
      dl.x += Math.cos(dl.zang) * 330 * dt;
      dl.y += Math.sin(dl.zang) * 330 * dt;
      if (dl.x < 24 || dl.x > W - 24) dl.zang = Math.PI - dl.zang;
      if (dl.y < 50 || dl.y > H - 30) dl.zang = -dl.zang;
      dl.x = Math.max(24, Math.min(W - 24, dl.x));
      dl.y = Math.max(50, Math.min(H - 30, dl.y));
      dl.facing = Math.cos(dl.zang) >= 0 ? 1 : -1;
      dl.waddlePhase += dt * 20;
      dl.moving = true;
      continue;
    }
    if (ecoRush > 0 && bulldozer) {
      const dx = bulldozer.x - dl.x;
      const dy = bulldozer.y - 6 - dl.y;
      const d = Math.hypot(dx, dy) || 1;
      dl.x += (dx / d) * 300 * dt;
      dl.y += (dy / d) * 300 * dt;
      dl.x = Math.max(24, Math.min(W - 24, dl.x));
      dl.y = Math.max(50, Math.min(H - 30, dl.y));
      dl.facing = dx >= 0 ? 1 : -1;
      dl.waddlePhase += dt * 22;
      dl.moving = true;
      if (Math.random() < 0.006) wordAt("peep!!", dl.x, dl.y - 30);
      continue;
    }
    let carSlot = 0;
    if (duck.brain === "ride") {
      const back = rideDist - (carSlot + 1) * 46;
      carSlot++;
      const pos = trackAt(back);
      dl.x = pos.x;
      dl.y = pos.y - 6;
      const ahead = trackAt(back + 3);
      dl.facing = ahead.x >= pos.x ? 1 : -1;
      dl.moving = false;
    } else {
      const leader = i === 0 ? duck : ducklings[i - 1];
      const dx = leader.x - dl.x;
      const dy = leader.y - dl.y;
      const d = Math.hypot(dx, dy);
      dl.moving = false;
      if (d > 34) {
        const speed = Math.min(210, 70 + (d - 34) * 3.5);
        dl.x += (dx / d) * speed * dt;
        dl.y += (dy / d) * speed * dt;
        if (Math.abs(dx) > 2) dl.facing = dx > 0 ? 1 : -1;
        dl.waddlePhase += dt * 13;
        dl.moving = true;
      }
    }
    dl.x = Math.max(24, Math.min(W - 24, dl.x));
    dl.y = Math.max(50, Math.min(H - 30, dl.y));
    dl.peepTimer -= dt;
    if (dl.peepTimer <= 0) {
      dl.peepTimer = rand(6, 14);
      if (state === "play") {
        playPeep();
        particles.push({ type: "word", text: "peep!", x: dl.x, y: dl.y - 30, life: 1.2 });
      }
    }
  }
}

function buildTrack() {
  const ring = [];
  const count = Math.floor(rand(9, 12));
  for (let i = 0; i < count; i++) {
    for (let tries = 0; tries < 80; tries++) {
      const p = { x: rand(90, 660), y: rand(95, 455) };
      if (nearPond(p.x, p.y, 30)) continue;
      let ok = true;
      for (const q of ring) {
        if (Math.hypot(p.x - q.x, p.y - q.y) < 80) ok = false;
      }
      if (Math.hypot(p.x - 700, p.y - 485) < 110) ok = false;
      if (ok) {
        ring.push(p);
        break;
      }
    }
  }
  ring.sort((a, b) => Math.atan2(a.y - 330, a.x - 400) - Math.atan2(b.y - 330, b.x - 400));
  const cps = [{ x: 700, y: 485 }, ...ring, { x: rand(600, 645), y: rand(468, 488) }];
  if (Math.random() < 0.7 && ring.length > 2) {
    const lp = ring[Math.floor(rand(0, ring.length))];
    let r = rand(42, 62);
    r = Math.min(r, Math.max(30, (lp.y - 80) / 1.7));
    const loopPts = [];
    for (let a = 0; a < 4; a++) {
      loopPts.push({
        x: lp.x + Math.cos((a / 4) * Math.PI * 2) * r,
        y: lp.y + Math.sin((a / 4) * Math.PI * 2) * r - r * 0.7
      });
    }
    cps.splice(cps.indexOf(lp) + 1, 0, ...loopPts);
  }
  const pts = [];
  const n = cps.length;
  for (let i = 0; i < n; i++) {
    const p0 = cps[(i - 1 + n) % n];
    const p1 = cps[i];
    const p2 = cps[(i + 1) % n];
    const p3 = cps[(i + 2) % n];
    for (let j = 0; j < 24; j++) {
      const t = j / 24;
      const t2 = t * t;
      const t3 = t2 * t;
      pts.push({
        x: 0.5 * (2 * p1.x + (-p0.x + p2.x) * t + (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 + (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3),
        y: 0.5 * (2 * p1.y + (-p0.y + p2.y) * t + (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 + (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3)
      });
    }
  }
  const cum = [0];
  for (let i = 1; i <= pts.length; i++) {
    const a = pts[i - 1];
    const b = pts[i % pts.length];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const total = cum[pts.length];
  const ties = [];
  for (let d = 0; d < total; d += 26) {
    const p = pointOnTrack({ pts, cum, total }, d);
    const q = pointOnTrack({ pts, cum, total }, d + 3);
    ties.push({ x: p.x, y: p.y, ang: Math.atan2(q.y - p.y, q.x - p.x) });
  }
  const posts = [];
  for (let d = 60; d < total; d += 170) {
    const p = pointOnTrack({ pts, cum, total }, d);
    if (p.y < 420) posts.push(p);
  }
  return { pts, cum, total, ties, posts };
}

function pointOnTrack(tr, d) {
  d = ((d % tr.total) + tr.total) % tr.total;
  let lo = 0;
  let hi = tr.cum.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (tr.cum[mid] <= d) lo = mid;
    else hi = mid;
  }
  const a = tr.pts[lo % tr.pts.length];
  const b = tr.pts[(lo + 1) % tr.pts.length];
  const seg = tr.cum[lo + 1] - tr.cum[lo] || 1;
  const t = (d - tr.cum[lo]) / seg;
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

function trackAt(d) {
  return pointOnTrack(track, d);
}

function playWhee() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(320, t0);
  osc.frequency.exponentialRampToValueAtTime(980, t0 + 0.6);
  gain.gain.setValueAtTime(0.001, t0);
  gain.gain.linearRampToValueAtTime(0.12, t0 + 0.15);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.7);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.75);
}

function spawnHat() {
  for (let tries = 0; tries < 300; tries++) {
    const x = rand(60, W - 60);
    const y = rand(100, H - 60);
    if (nearPond(x, y, 20)) continue;
    if (Math.hypot(x - duck.x, y - duck.y) < 120) continue;
    let bad = false;
    for (const log of logs) {
      if (logCollide(x, y, log, 30)) bad = true;
    }
    for (const p of pellets) {
      if (Math.hypot(x - p.x, y - p.y) < 45) bad = true;
    }
    if (bad) continue;
    groundHat = { x, y, type: Math.random() < 0.04 ? "shades" : pick(HAT_TYPES.filter(t => t !== "shades")), seed: rand(0, 10) };
    hatTimer = 0;
    return;
  }
  hatTimer = 5;
}

function updateVisitors(dt) {
  visitorTimer -= dt;
  if (visitorTimer <= 0 && visitors.length < 2) {
    spawnVisitor();
    visitorTimer = rand(16, 34);
  }
  for (let i = visitors.length - 1; i >= 0; i--) {
    const v = visitors[i];
    if (v.chase > 0) {
      v.chase -= dt;
      if (ecoRush > 0 && bulldozer) v.chase = Math.max(v.chase, 0.3);
      const tx = ecoRush > 0 && bulldozer ? bulldozer.x : mouseX;
      const ty = ecoRush > 0 && bulldozer ? bulldozer.y : mouseY;
      const dx = tx - v.x;
      const dy = ty - v.y;
      const d = Math.hypot(dx, dy) || 1;
      v.x = Math.max(24, Math.min(W - 24, v.x + (dx / d) * 145 * dt));
      v.y = Math.max(70, Math.min(H - 30, v.y + (dy / d) * 145 * dt));
      v.dir = dx >= 0 ? 1 : -1;
      v.phase += dt * 12;
      if (v.chase <= 0) {
        v.state = "run";
        v.pauseAt = null;
      }
      continue;
    }
    if (v.state === "pause") {
      v.pauseTimer -= dt;
      if (v.pauseTimer <= 0) v.state = "run";
    } else {
      v.x += v.dir * v.speed * dt;
      v.phase += dt * (v.kind === "bunny" ? 7 : 10);
      if (v.pauseAt !== null && ((v.dir > 0 && v.x >= v.pauseAt) || (v.dir < 0 && v.x <= v.pauseAt))) {
        v.state = "pause";
        v.pauseTimer = rand(0.9, 1.7);
        v.pauseAt = null;
      }
    }
    if (v.x < -70 || v.x > W + 70) visitors.splice(i, 1);
  }
}

  ]);

function updateFlocks(dt) {
  flockTimer -= dt;
  if (flockTimer <= 0 && flocks.length < 1) {
    spawnFlock();
    flockTimer = rand(24, 48);
  }
  for (let f = flocks.length - 1; f >= 0; f--) {
    const fl = flocks[f];
    if (fl.cursor > 0) {
      fl.cursor -= dt;
      fl.target = { x: mouseX, y: mouseY };
      if (fl.cursor <= 0) fl.target = { x: rand(200, 600), y: rand(70, 160) };
    } else {
      fl.life -= dt;
      if (fl.life <= 0) fl.target = { x: fl.dir > 0 ? W + 120 : -120, y: rand(60, 150) };
    }
    let cx = 0;
    let cy = 0;
    for (const b of fl.birds) {
      cx += b.x;
      cy += b.y;
    }
    cx /= fl.birds.length;
    cy /= fl.birds.length;
    let allOut = true;
    for (let i = 0; i < fl.birds.length; i++) {
      const b = fl.birds[i];
      if (fl.cursor > 0) {
        b.vx += (mouseX - b.x) * 6 * dt;
        b.vy += (mouseY - b.y) * 6 * dt;
        const damp = Math.exp(-3.2 * dt);
        b.vx *= damp;
        b.vy *= damp;
        for (let j = 0; j < fl.birds.length; j++) {
          if (j === i) continue;
          const o = fl.birds[j];
          const dx = b.x - o.x;
          const dy = b.y - o.y;
          const d = Math.hypot(dx, dy);
          if (d < 12 && d > 0.01) {
            b.vx += (dx / d) * 90 * dt;
            b.vy += (dy / d) * 90 * dt;
          }
        }
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        if (fl.life > 0 || (b.x > -80 && b.x < W + 80)) allOut = false;
        continue;
      }
      b.vx += (cx - b.x) * 0.8 * dt;
      b.vy += (cy - b.y) * 0.8 * dt;
      b.vx += (fl.target.x - cx) * 0.4 * dt;
      b.vy += (fl.target.y - cy) * 0.4 * dt;
      for (let j = 0; j < fl.birds.length; j++) {
        if (j === i) continue;
        const o = fl.birds[j];
        const dx = b.x - o.x;
        const dy = b.y - o.y;
        const d = Math.hypot(dx, dy);
        if (d < 24 && d > 0.01) {
          b.vx += (dx / d) * 70 * dt;
          b.vy += (dy / d) * 70 * dt;
        }
      }
      const sp = Math.hypot(b.vx, b.vy) || 1;
      if (sp > 130) {
        b.vx = (b.vx / sp) * 130;
        b.vy = (b.vy / sp) * 130;
      } else if (sp < 55 && fl.life > 0) {
        b.vx = (b.vx / sp) * 55;
        b.vy = (b.vy / sp) * 55;
      }
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (fl.life > 0 || (b.x > -80 && b.x < W + 80)) allOut = false;
    }
    if (allOut) flocks.splice(f, 1);
  }
}

    snowman.timer -= dt;
    const dx = mouseX - snowman.x;
    const dy = mouseY - snowman.y;
    const d = Math.hypot(dx, dy) || 1;
    snowman.x = Math.max(30, Math.min(W - 30, snowman.x + (dx / d) * 130 * dt));
    snowman.y = Math.max(60, Math.min(H - 20, snowman.y + (dy / d) * 130 * dt));

      particles.push({ type: "spark", x: snowman.x + rand(-16, 16), y: snowman.y + 24, vx: rand(-25, 25), vy: rand(-45, -10), life: 0.4, color: "#fff", size: rand(1.5, 3) });
    }
    if (snowman.timer <= 0) snowman.state = "return";
  } else if (snowman.state === "return") {
    const dx = 250 - snowman.x;
    const dy = 250 - snowman.y;
    const d = Math.hypot(dx, dy);
    if (d < 4) {
      snowman.x = 250;
      snowman.y = 250;
      snowman.state = "calm";
    } else {
      snowman.x += (dx / d) * 90 * dt;
      snowman.y += (dy / d) * 90 * dt;
    }
  }
}

function playJingle() {
  if (muted || !actx) return;
  [392, 494, 587].forEach((f, i) => {
    const t0 = actx.currentTime + i * 0.12;
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = "triangle";
    osc.frequency.value = f;
    gain.gain.setValueAtTime(0.12, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.3);
  });
}

function playHonk() {
  if (muted || !actx) return;
  const t0 = actx.currentTime;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = "sawtooth";
  osc.frequency.setValueAtTime(520, t0);
  osc.frequency.exponentialRampToValueAtTime(240, t0 + 0.22);
  gain.gain.setValueAtTime(0.16, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.25);
  osc.connect(gain).connect(actx.destination);
  osc.start(t0);
  osc.stop(t0 + 0.3);
}

    x: dir > 0 ? -70 : W + 70,
    y,
    dir,
    state: "arrive",
    timer: 0,
    phase: 0,
    exitX: dir > 0 ? W + 90 : -90,
    exitY: y
  };
  playHonk();
  particles.push({ type: "word", text: "HONK!!", x: Math.max(40, Math.min(W - 40, goose.x)), y: y - 40, life: 1.3 });
}

function updateGoose(dt) {
  gooseTimer -= dt;
  if (gooseTimer <= 0 && !goose && state === "play") {
    spawnGoose();
  }
  if (!goose) return;
  const g = goose;
  if (ecoRush > 0 && bulldozer) {
    const dx = bulldozer.x - g.x;
    const dy = bulldozer.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    g.x += (dx / d) * 240 * dt;
    g.y += (dy / d) * 240 * dt;
    g.dir = dx >= 0 ? 1 : -1;
    g.phase += dt * 14;
    if (Math.random() < 0.02) wordAt("HONK!!", g.x, g.y - 55);
    return;
  }
  if (g.state === "clickedFlee") {
    g.timer -= dt;
    const dx = g.x - duck.x;
    const dy = g.y - duck.y;
    const d = Math.hypot(dx, dy) || 1;
    g.x = Math.max(30, Math.min(W - 30, g.x + (dx / d) * 210 * dt));
    g.y = Math.max(90, Math.min(H - 60, g.y + (dy / d) * 210 * dt));
    g.dir = dx >= 0 ? 1 : -1;
    g.phase += dt * 13;
    if (g.timer <= 0) {
      if (g.resume === "flee") {
        g.state = "flee";
      } else {
        g.state = "chase";
        g.timer = 3;
        duck.brain = "flee";
        say(pick(["NOT AGAIN!", "OH NO!", "AAAAA!"]));
        playHonk();
      }
    }
    return;
  }
  if (g.state === "arrive") {
    const dx = duck.x - g.x;
    const dy = duck.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    g.x += (dx / d) * 150 * dt;
    g.y += (dy / d) * 150 * dt;
    g.dir = dx >= 0 ? 1 : -1;
    g.phase += dt * 9;
    if (d < 150) {
      g.state = "chase";
      g.timer = 4;
      duck.brain = "flee";
      say(pick(["AAAAA!", "HELP!", "A GOOSE!!"]));
      playHonk();
    }
  } else if (g.state === "chase") {
    g.timer -= dt;
    const dx = duck.x - g.x;
    const dy = duck.y - g.y;
    const d = Math.hypot(dx, dy) || 1;
    g.x += (dx / d) * 185 * dt;
    g.y += (dy / d) * 185 * dt;
    g.dir = dx >= 0 ? 1 : -1;
    g.phase += dt * 11;
    if (g.timer <= 0) {
      g.state = "standoff";
      g.timer = 1.2;
      duck.brain = "stand";
      duck.moving = false;
      duck.facing = g.x >= duck.x ? 1 : -1;
      duck.hop = 0.4;
      say("HEY!!");
      particles.push({ type: "word", text: "HONK?!", x: g.x, y: g.y - 45, life: 1.2 });
    }
  } else if (g.state === "standoff") {
    g.timer -= dt;
    if (g.timer <= 0) {
      g.state = "flee";
      g.exitY = Math.max(100, Math.min(H - 70, g.y));
      duck.brain = "brave";
      say("QUAAAAACK!!");
      playQuack();
      playQuack();
    }
  } else if (g.state === "flee") {
    const dx = g.exitX - g.x;
    const dy = g.exitY - g.y;
    const d = Math.hypot(dx, dy) || 1;
    g.x += (dx / d) * 190 * dt;
    g.y += (dy / d) * 190 * dt;
    g.dir = dx >= 0 ? 1 : -1;
    g.phase += dt * 12;
    if ((g.dir > 0 && g.x > W + 80) || (g.dir < 0 && g.x < -80)) {
      goose = null;
      gooseTimer = rand(60, 120);
      duck.brain = "idle";
      duck.stateTimer = 1.5;
      duck.hop = 0.5;
      duck.happyTimer = 1.4;
      say(pick(["VICTORY!", "AND STAY OUT!", "MY POND!"]));
      for (let j = 0; j < 5; j++) {
        particles.push({ type: "heart", x: duck.x + rand(-16, 16), y: duck.y - 30, life: rand(0.9, 1.3), size: rand(0.8, 1.3) });
      }
    }
  }
}

function moveBeeToward(b, tx, ty, speed, dt) {
  const dx = tx - b.x;
  const dy = ty - b.y;
  const d = Math.hypot(dx, dy);
  if (Math.abs(dx) > 1) b.face = dx > 0 ? 1 : -1;
  if (d < 6) return true;
  b.x += (dx / d) * speed * dt;
  b.y += (dy / d) * speed * dt;
  return false;
}

function updateFlowers(dt) {
  const dormant = theme().name === "WINTER" || theme().name === "NIGHT";
  for (const f of flowers) {
    if (f.puff > 0) f.puff -= dt;
    if (!dormant && f.grow < 1) f.grow = Math.min(1, f.grow + dt * rand(0.12, 0.2));
  }
  if (!dormant) {
    flowerSeedTimer -= dt;
    if (flowerSeedTimer <= 0 && flowers.length < 11) {
      flowerSeedTimer = rand(8, 15);
      const spot = findFlowerSpot();
      flowers.push({ x: spot.x, y: spot.y, petal: pick(["#ff8fb1", "#ffffff", "#ffd6e8", "#d9b3ff"]), grow: 0, puff: 0, phase: rand(0, 6.28) });
    }
  }
}

function updateBees(dt) {
  if (theme().name === "WINTER" || theme().name === "NIGHT") return;
  for (const b of bees) {
    if (ecoRush > 0 && bulldozer) {
      moveBeeToward(b, bulldozer.x + rand(-40, 40), bulldozer.y - 40, 180, dt);
      continue;
    }
    if (b.state === "wander") {
      b.tx += Math.sin(time * 0.8 + b.wob) * 20 * dt;
      b.ty += Math.cos(time * 0.7 + b.wob) * 14 * dt;
      moveBeeToward(b, b.tx, b.ty, 55, dt);
      b.timer -= dt;
      if (b.timer <= 0) {
        b.timer = rand(2, 4);
        const bloomed = flowers.filter(f => f.grow >= 1);
        if (bloomed.length && Math.random() < 0.8) {
          b.target = pick(bloomed);
          b.state = "toFlower";
        } else {
          b.tx = rand(80, W - 80);
          b.ty = rand(110, H - 120);
        }
      }
    } else if (b.state === "toFlower") {
      if (!flowers.includes(b.target) || b.target.grow < 1) {
        b.state = "wander";
        b.target = null;
        b.timer = 0.5;
        continue;
      }
      const f = b.target;
      const tx = f.x + Math.sin(time * 1.5 + f.phase) * (f.grow * 2);
      const ty = f.y - (6 + f.grow * 20) - 4;
      if (moveBeeToward(b, tx, ty, 85, dt)) {
        b.state = "sit";
        b.timer = 2.5;
      }
    } else {
      if (!flowers.includes(b.target)) {
        b.state = "wander";
        b.target = null;
        b.timer = 0.5;
        continue;
      }
      b.timer -= dt;
      const f = b.target;
      b.x = f.x + Math.sin(time * 1.5 + f.phase) * f.grow * 2 + Math.sin(time * 6 + b.wob) * 2;
      b.y = f.y - (6 + f.grow * 20) - 4 + Math.sin(time * 20 + b.wob) * 1.5;
      if (b.timer <= 0) {
        f.puff = 0.9;
        if (Math.random() < 0.6 && flowers.length < 11) {
          const spot = findFlowerSpot();
          flowers.push({ x: spot.x, y: spot.y, petal: pick(["#ff8fb1", "#ffffff", "#ffd6e8", "#d9b3ff"]), grow: 0, puff: 0, phase: rand(0, 6.28) });
        }
        b.state = "wander";
        b.timer = rand(1.5, 3);
        b.tx = rand(80, W - 80);
        b.ty = rand(110, H - 120);
      }
    }
  }
}

function drawBees() {
  if (theme().name === "WINTER" || theme().name === "NIGHT") return;
  for (const b of bees) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.face || 1, 1);
    const wing = Math.abs(Math.sin(time * 45 + b.wob));
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath();
    ctx.ellipse(-1, -5, 3.5, 4.5 * wing + 1, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(1.5, -4.5, 3, 3.8 * wing + 1, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ffd93d";
    ctx.beginPath();
    ctx.ellipse(0, 0, 6, 4.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2b2b2b";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-1.5, -4);
    ctx.lineTo(-1.5, 4);
    ctx.moveTo(1.8, -3.8);
    ctx.lineTo(1.8, 3.8);
    ctx.stroke();
    ctx.fillStyle = "#2b2b2b";
    ctx.beginPath();
    ctx.arc(5.2, -1, 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-9, -1.5);
    ctx.lineTo(-9, 1.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function giveFlower() {
  love = Math.min(LOVE_MAX, love + 1);
  loveShow = 4;
  duck.hop = 0.5;
  duck.happyTimer = 1.5;
  say(pick(["FOR ME?!", "FLOWERS!!", "SO SWEET!", "THANK YOU!"]));

  for (let i = 0; i < 5; i++) {
    particles.push({ type: "heart", x: duck.x + rand(-16, 16), y: duck.y - 30, life: rand(0.9, 1.3), size: rand(0.8, 1.4) });
  }
}

function heartPath() {
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.bezierCurveTo(-9, -4, -5, -10, 0, -5);
  ctx.bezierCurveTo(5, -10, 9, -4, 0, 4);
  ctx.closePath();
}

function drawHeartShape(x, y, s, fillFrac) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 10, s / 10);
  ctx.save();
  heartPath();
  ctx.clip();
  ctx.fillStyle = "#ff5c8d";
  ctx.fillRect(-10, 4 - 14 * fillFrac - 0.5, 20, 14 * fillFrac + 1);
  ctx.restore();
  heartPath();
  ctx.lineWidth = 1.8 / (s / 10);
  ctx.strokeStyle = "#fff";
  ctx.stroke();
  ctx.restore();
}

function drawLoveHeart() {
  if (loveShow <= 0 || love <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(1, loveShow * 1.5);
  const hx = duck.x + 36;
  const hy = duck.y - 55 + Math.sin(time * 3) * 3;
  drawHeartShape(hx, hy, 11 + (love / LOVE_MAX) * 15, love / LOVE_MAX);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawPickedFlower() {

  ctx.moveTo(0, 16);
  ctx.lineTo(0, 0);
  ctx.stroke();
  ctx.fillStyle = "#4c9a3d";
  ctx.beginPath();
  ctx.ellipse(-4, 8, 4, 2, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = f.petal;
  for (let i = 0; i < 5; i++) {
    const a = (i * Math.PI * 2) / 5 + 0.3 + time;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * 5, Math.sin(a) * 5, 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#ffd93d";
  ctx.beginPath();
  ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function spawnMaisy() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  maisy = {
    x: dir > 0 ? -180 : W + 180,
    y: 528,
    dir,
    stopX: rand(270, 530),
    state: "driving",
    timer: 0,
    offX: 0,
    figX: 0,
    bit: false,
    phase: 0,
    line: pick(MAISY_LINES)
  };
}

function updateMaisy(dt) {
  maisyTimer -= dt;
  if (maisyTimer <= 0 && !maisy && state === "play") {
    spawnMaisy();
  }
  if (!maisy) return;
  const m = maisy;
  if (m.state === "driving") {
    m.x += m.dir * 150 * dt;
    m.phase += dt * 10;
    if ((m.dir > 0 && m.x >= m.stopX) || (m.dir < 0 && m.x <= m.stopX)) {
      m.state = "out";
      m.timer = 0.8;
      playJingle();
    }
  } else if (m.state === "out") {
    m.timer -= dt;
    m.offX = Math.min(46, ((0.8 - m.timer) / 0.8) * 46);
    m.figX = m.x + m.dir * m.offX;
    if (m.timer <= 0) {
      m.state = "talking";
      m.timer = 4.5;
    }
  } else if (m.state === "talking") {
    m.offX = 46;
    m.figX = m.x + m.dir * 46;
    m.timer -= dt;
    if (m.timer <= 0) {
      if (carrot) {
        m.state = "walkCarrot";
        m.offX = 46;
      } else if (Math.random() < 0.55) {
        m.state = "walkPond";
        m.offX = 46;
      } else {
        m.state = "back";
        m.timer = 0.8;
      }
    }
  } else if (m.state === "walkPond") {
    const dx = 212 - m.figX;
    m.figX += Math.sign(dx) * 120 * dt;
    m.dir = dx >= 0 ? 1 : -1;
    m.phase += dt * 10;
    if (Math.abs(dx) < 6) {
      m.state = "fishing";
      m.timer = 3.5;
      m.bit = false;
      playJingle();
    }
  } else if (m.state === "fishing") {
    m.timer -= dt;
    if (m.timer < 1.2 && !m.bit) {
      m.bit = true;
      particles.push({ type: "ring", x: m.figX + m.dir * 40, y: 514, life: 0.6, color: "#bfe8ff", size: 4 });
      playPeep();
    }
    if (Math.random() < 0.06) {
      particles.push({ type: "ring", x: m.figX + m.dir * 40, y: 514, life: 0.7, color: "#bfe8ff", size: 3 });
    }
    if (m.timer <= 0) {
      particles.push({ type: "fish", x: m.figX + m.dir * 40, y: 512, vx: m.dir * 90, vy: -170, life: 1.1 });
      particles.push({ type: "word", text: "I caught one!", x: m.figX, y: m.y - 90, life: 1.5 });
      playJingle();
      for (let i = 0; i < 6; i++) {
        particles.push({ type: "spark", x: m.figX + m.dir * 40, y: 512, vx: rand(-60, 60), vy: rand(-140, -60), life: 0.5, color: "#bfe8ff", size: rand(2, 3.5) });
      }
      m.state = "returnBack";
    }
  } else if (m.state === "walkCarrot") {
    if (!carrot) {
      m.state = "back";
      m.timer = 0.8;
    } else {
      const dx = carrot.x - m.figX;
      m.figX += Math.sign(dx) * 130 * dt;
      m.dir = dx >= 0 ? 1 : -1;
      m.phase += dt * 10;
      if (Math.abs(dx) < 22) {
        m.state = "eating";
        m.timer = 1.8;
        m.biteT = 0.4;
      }
    }
  } else if (m.state === "eating") {
    m.timer -= dt;
    m.biteT -= dt;
    if (m.biteT <= 0 && carrot) {
      m.biteT = 0.4;
      carrot.bites = Math.min(3, carrot.bites + 1);
      playCrackle(0);
      for (let i = 0; i < 4; i++) {
        particles.push({ type: "spark", x: carrot.x + rand(-8, 8), y: carrot.y - rand(0, 10), vx: rand(-50, 50), vy: rand(-80, -20), life: 0.5, color: "#ff8c42", size: rand(1.5, 3) });
      }
    }
    if (m.timer <= 0) {
      carrot = null;
      carrotTimer = rand(25, 50);
      particles.push({ type: "word", text: "yum!", x: m.figX, y: m.y - 84, life: 1.3 });
      playJingle();
      m.state = "returnBack";
    }
  } else if (m.state === "returnBack") {
    const dx = m.x + m.dir * 46 - m.figX;
    if (Math.abs(dx) < 6) {
      m.state = "back";
      m.timer = 0.8;
      m.offX = 46;
    } else {
      m.figX += Math.sign(dx) * 130 * dt;
      m.dir = dx >= 0 ? 1 : -1;
      m.phase += dt * 10;
    }
  } else if (m.state === "back") {
    m.timer -= dt;
    m.offX = Math.max(0, (m.timer / 0.8) * 46);
    m.figX = m.x + m.dir * m.offX;
    if (m.timer <= 0) {
      m.state = "drivingOff";
    }
  } else {
    m.x += m.dir * 190 * dt;
    m.phase += dt * 12;
    if (m.x < -220 || m.x > W + 220) {
      maisy = null;
      maisyTimer = rand(90, 150);
    }
  }
}

  ctx.fillStyle = "#d0342c";
  ctx.font = "bold 8px 'Comic Sans MS', 'Chalkboard SE', cursive";

  ctx.textBaseline = "middle";

  ctx.beginPath();

  if (m.state === "out" || m.state === "talking" || m.state === "back") {

  }
  ctx.fillStyle = "#2b2b2b";

function makeTrees() {
  trees = [];
  let tries = 0;
  while (trees.length < 3 && tries < 400) {
    tries++;
    const x = rand(160, 640);
    const y = rand(180, 400);
    if (nearPond(x, y, 120)) continue;
    if (Math.hypot(x - 700, y - 500) < 170) continue;
    let bad = false;
    for (const t of trees) {
      if (Math.hypot(x - t.x, y - t.y) < 190) bad = true;
    }
    for (const l of logs) {
      if (logCollide(x, y, l, 40)) bad = true;
    }
    if (bad) continue;
    trees.push({ x, y, chop: 0, state: "alive", t: 0, regrow: 0, grow: 1, shake: 0, fallDir: 1, sway: rand(0, 6.28) });
  }
}

      tr.regrow -= dt;

function updateButterfly(dt) {

  if (b.x > W - 30) b.ang = Math.PI + rand(-0.6, 0.6);
  if (b.y < 80) b.ang = rand(0.9, 2.2);
  if (b.y > H - 40) b.ang = -rand(0.9, 2.2);
  b.x += Math.cos(b.ang) * speed * dt;
  b.y += Math.sin(b.ang) * speed * dt;
}

function update(dt) {
  time += dt;
  for (const c of clouds) {
    c.x += c.v * dt;
    if (c.x > W + 120) c.x = -120;
    if (c.rain > 0) {
      c.rain -= dt;
      if (Math.random() < 0.4) {
        particles.push({ type: "spark", x: c.x + rand(-22, 22), y: c.y + 22, vx: rand(-8, 8), vy: rand(90, 150), life: 0.5, color: "#9cd0ee", size: rand(1.5, 2.8) });
      }
    }
  }
  updateButterfly(dt);
  updateEggs(dt);
  updateDucklings(dt);
  updateVisitors(dt);
  updateElon(dt);
  updateWizard(dt);
  updateLogs(dt);
  updateTrees(dt);
  updateBulldozer(dt);
  updateSnowman(dt);
  updateGoose(dt);
  updateMaisy(dt);
  updateDad(dt);
  updateGnome(dt);
  updateFlowers(dt);
  updateBees(dt);
  updateFrogs(dt);
  updateWeather(dt);
  updateFireworks(dt);
  updateFlocks(dt);
  if (shake > 0) shake -= dt;
  if (sunHype > 0) sunHype -= dt;
  if (ecoMsg > 0) ecoMsg -= dt;
  if (fineMsg > 0) fineMsg -= dt;
  if (pondCooldown > 0) pondCooldown -= dt;
  if (loveShow > 0) loveShow -= dt;
  if (teslaPitch > 0) teslaPitch -= dt;
  if (spellMode > 0) {
    spellMode -= dt;
    shake = Math.max(shake, 0.06);
    if (Math.random() < 0.5) {
      particles.push({
        type: "spark",
        x: rand(0, W),
        y: rand(0, H),
        vx: rand(-60, 60),
        vy: rand(-80, 20),
        life: rand(0.4, 0.9),
        color: "hsl(" + Math.round(rand(0, 360)) + ", 85%, 65%)",
        size: rand(2, 5)
      });
    }
    if (Math.random() < 0.15) {
      particles.push({ type: "twinkle", x: rand(0, W), y: rand(0, H), life: rand(0.4, 0.8), color: pick(["#fff", "#ffd93d", "#b388ff", "#5bc0eb"]), size: rand(2, 4), seed: rand(0, 10) });
    }
  }
  if (keanuFly > 0) {
    keanuFly -= dt;
    const p = 1 - keanuFly / 1.2;
    if (Math.random() < 0.5) {
      particles.push({ type: "spark", x: 400 + p * 550 + rand(-20, 20), y: 430 - p * 420 + rand(-20, 20), vx: rand(-40, 40), vy: rand(-40, 40), life: 0.5, color: "#33dd55", size: rand(2, 4) });
    }
    if (keanuFly <= 0) keanuGone = true;
  }
  if (matrixMode > 0) {
    matrixMode -= dt;
    updateMatrixRain(dt);
  }

  if (state === "clear") {
    for (const p of particles) {
      if (p.type !== "confetti") continue;
      p.y += p.vy * dt * 60;
      p.x += p.vx * dt * 60;
      p.rot += p.vr * dt;
      if (p.y > H + 20) {
        p.y = -20;
        p.x = rand(0, W);
      }
    }
    clearTimer -= dt;
    if (clearTimer <= 0) advanceStage();
    return;
  }

  duck.blinkTimer -= dt;
  if (duck.blinkTimer <= 0) {
    duck.blinking = 0.13;
    duck.blinkTimer = rand(2, 5);
  }
  if (duck.blinking > 0) duck.blinking -= dt;

  if (duck.bubbleTimer > 0) duck.bubbleTimer -= dt;
  if (duck.tripCooldown > 0) duck.tripCooldown -= dt;
  if (duck.hop > 0) duck.hop -= dt;
  if (duck.happyTimer > 0) duck.happyTimer -= dt;
  if (!groundHat) {
    hatTimer -= dt;
    if (hatTimer <= 0) spawnHat();
  }
  if (levelBanner > 0) levelBanner -= dt;
  if (resetArm > 0) resetArm -= dt;
  if (save.level >= 5 && state === "play" && duck.tripping <= 0) {
    sparkleTick -= dt;
    if (sparkleTick <= 0) {
      sparkleTick = 1.1;
      particles.push({ type: "spark", x: duck.x + rand(-18, 18), y: duck.y - rand(10, 46), vx: rand(-8, 8), vy: -28, life: 0.7, color: "#fff8d0", size: rand(2, 3.5) });
    }
  }
  if (fireworks.length < 3) {
    fireworkTimer -= dt;
    if (fireworkTimer <= 0) spawnFirework();
  }

  if (duck.tripping > 0) {
    duck.tripping -= dt;
    duck.dizzyAngle += dt * 9;
    if (duck.tripping <= 0) {
      duck.tripping = 0;
      decide();
    }
  } else {
    duck.moving = false;
    if (ecoRush > 0 && bulldozer && duck.brain !== "protest" && !duck.dragged) {
      duck.brain = "protest";
    }
    if (groundHat && !duck.dragged && duck.brain !== "collect" && duck.brain !== "ride" && duck.brain !== "toRide" && duck.brain !== "onRide" && duck.brain !== "tripped" && duck.brain !== "flee" && duck.brain !== "stand" && duck.brain !== "brave" && duck.brain !== "protest") {
      startCollect();
    }
    if (!duck.dragged) {
      switch (duck.dragged ? "dragged" : duck.brain) {
        case "dragged":
          duck.x = Math.max(34, Math.min(W - 34, mouseX));
          duck.y = Math.max(60, Math.min(H - 34, mouseY));
          break;
      case "seek":
        if (moveToward(duck.target.x, duck.target.y, excitedSpeed(), dt)) decide();
        break;
      case "wander":
        if (moveToward(duck.target.x, duck.target.y, walkSpeed(), dt)) decide();
        break;
      case "pond":
        if (moveToward(duck.target.x, duck.target.y, walkSpeed(), dt)) startDrink();
        break;
      case "drink":
        duck.stateTimer -= dt;
        duck.drinkTick -= dt;
        if (duck.drinkTick <= 0) {
          duck.drinkTick = 0.55;
          particles.push({ type: "ring", x: duck.x + duck.facing * 20, y: duck.y + 22, life: 0.6, color: "#bde8ff", size: 5 });
        }
        if (duck.stateTimer <= 0) decide();
        break;
      case "nap":
        duck.stateTimer -= dt;
        duck.napTick -= dt;
        if (duck.napTick <= 0) {
          duck.napTick = 0.8;
          particles.push({ type: "zzz", x: duck.x + 16, y: duck.y - 42, life: 1.6 });
        }
        if (duck.stateTimer <= 0) {
          say("QUACK!", 1.2);
          playQuack();
          decide();
        }
        break;
      case "chase": {
        duck.stateTimer -= dt;
        const d = Math.hypot(butterfly.x - duck.x, butterfly.y - duck.y);
        if (d < 30 && butterfly.flee <= 0) {
          butterfly.flee = 1.2;
          butterfly.ang = Math.atan2(butterfly.y - duck.y, butterfly.x - duck.x);
          duck.hop = 0.5;
          say("FRIEND!");
          playQuack();
          for (let i = 0; i < 6; i++) {
            particles.push({
              type: "spark",
              x: butterfly.x,
              y: butterfly.y,
              vx: rand(-80, 80),
              vy: rand(-80, 80),
              life: 0.5,
              color: pick(["#ff8fb1", "#d9b3ff", "#fff"]),
              size: rand(2, 4)
            });
          }
          decide();
        } else {
          const tx = butterfly.x - duck.facing * 14;
          const ty = butterfly.y + 26;
          if (moveToward(tx, ty, excitedSpeed(), dt) || duck.stateTimer <= 0) decide();
        }
        break;
      }
      case "toRide":
        if (moveToward(duck.target.x, duck.target.y, walkSpeed(), dt)) {
          if (duck.rideKind === "coaster") {
            duck.brain = "ride";
            rideDist = 0;
            rideLaps = 0;
            say("WHEEE!!");
            playWhee();
          } else {
            duck.brain = "onRide";
            duck.rideT = 0;
            duck.x = duck.target.x;
            duck.y = duck.target.y;
            if (duck.rideKind === "trampoline") say("BOING!");
          }
        }
        break;
      case "onRide": {
        duck.rideT += dt;
        const k = duck.rideKind;
        if (k === "catapult" || k === "cannon") {
          if (!duck.launched) {
            if (k === "catapult") {
              duck.x = 300 + Math.cos(-2.35) * 50;
              duck.y = 418 + Math.sin(-2.35) * 50;
              if (duck.rideT >= 0.5) {
                duck.launched = true;
                duck.spinning = true;
                duck.spinA = 0;
                const lx = rand(560, 700);
                const ly = rand(380, 460);
                const T = 1.5;
                duck.fvx = (lx - duck.x) / T;
                duck.fvy = (ly - duck.y) / T - 0.5 * 620 * T;
                duck.flandY = ly;
                say("AAAAA!");
                playWhee();
              }
            } else {
              if (duck.rideT >= 0.8) {
                duck.launched = true;
                duck.spinning = true;
                duck.spinA = 0;
                duck.x = 225;
                duck.y = 385;
                const lx = rand(560, 700);
                const ly = rand(360, 450);
                const T = 1.3;
                duck.fvx = (lx - duck.x) / T;
                duck.fvy = (ly - duck.y) / T - 0.5 * 620 * T;
                duck.flandY = ly;
                playBonk();
                for (let s = 0; s < 10; s++) {
                  particles.push({ type: "spark", x: 225, y: 385, vx: rand(-60, 60), vy: rand(-60, 20), life: 0.5, color: "#ddd", size: rand(3, 6) });
                }
                say("BLAST OFF!");
              }
            }
          } else {
            duck.x += duck.fvx * dt;
            duck.y += duck.fvy * dt;
            duck.fvy += 620 * dt;
            duck.spinA += dt * 10;
            duck.facing = duck.fvx >= 0 ? 1 : -1;
            if (duck.fvy > 0 && duck.y >= duck.flandY) {
              duck.y = duck.flandY;
              duck.spinning = false;
              playBonk();
              for (let s = 0; s < 8; s++) {
                particles.push({ type: "spark", x: duck.x, y: duck.y + 10, vx: rand(-70, 70), vy: rand(-90, -20), life: 0.5, color: "#c9b894", size: rand(2.5, 5) });
              }
              particles.push({ type: "ring", x: duck.x, y: duck.y + 10, life: 0.4, color: "#fff", size: 6 });
              say(pick(["SAFE!", "STUCK THE LANDING!", "TADA!"]));
              duck.hop = 0.4;
              endRide();
            }
          }
        } else if (k === "trampoline") {
          duck.facing = 1;
          duck.y = 430 - Math.abs(Math.sin(duck.rideT * 4)) * Math.min(150, 40 + duck.rideT * 60);
          if (duck.rideT >= 2.9) {
            duck.x += 26;
            duck.y = 448;
            say("TADA!");
            endRide();
          }
        } else if (k === "slide") {
          const t = Math.min(1, duck.rideT / 2.2);
          const p = slidePoint(t);
          duck.x = p.x;
          duck.y = p.y;
          duck.facing = 1;
          if (t >= 1) {
            playPlop();
            for (let s = 0; s < 10; s++) {
              particles.push({ type: "spark", x: duck.x, y: duck.y, vx: rand(-70, 70), vy: rand(-120, -40), life: 0.5, color: "#a8e4ff", size: rand(2, 4) });
            }
            particles.push({ type: "ring", x: duck.x, y: duck.y, life: 0.6, color: "#e8f7ff", size: 6 });
            say("SPLASH!");
            endRide();
          }
        }
        break;
      }
      case "ride": {
        rideDist += 340 * dt;
        const pos = trackAt(rideDist);
        duck.x = pos.x;
        duck.y = pos.y - 8;
        const ahead = trackAt(rideDist + 4);
        duck.facing = ahead.x >= pos.x ? 1 : -1;
        if (rideDist >= (rideLaps + 1) * track.total) {
          rideLaps++;
          if (rideLaps >= 2) {
            duck.brain = "idle";
            duck.stateTimer = 1.6;
            duck.x = 675;
            duck.y = 502;
            duck.hop = 0.4;
            say(pick(["AGAIN! AGAIN!", "BEST RIDE EVER!", "SO FUN!!"]));
          } else {
            say("WHEEE!");
            playWhee();
          }
        }
        break;
      }
      case "collect":
        if (!groundHat) {
          decide();
        } else if (moveToward(groundHat.x, groundHat.y, excitedSpeed(), dt)) {
          pickupHat();
        }
        break;
      case "protest":
        if (!bulldozer || ecoRush <= 0) {
          decide();
          break;
        }
        moveToward(bulldozer.x + (duck.x < bulldozer.x ? -75 : 75), bulldozer.y + 8, excitedSpeed() + 40, dt);
        if (Math.random() < 0.015) wordAt(pick(["SAVE THE TREES!", "HEY!!", "NOT OKAY!"]), duck.x, duck.y - 60);
        break;
      case "flee": {
        if (!goose) {
          decide();
          break;
        }
        const dx = duck.x - goose.x;
        const dy = duck.y - goose.y;
        const d = Math.hypot(dx, dy) || 1;
        moveToward(duck.x + (dx / d) * 120, duck.y + (dy / d) * 120, excitedSpeed() + 15, dt);
        break;
      }
      case "stand":
        duck.moving = false;
        break;
      case "brave":
        if (!goose) {
          decide();
        } else {
          moveToward(goose.x, goose.y, excitedSpeed() + 45, dt);
        }
        break;
      case "idle":
        duck.stateTimer -= dt;
        if (duck.stateTimer <= 0) decide();
        break;
      default:
        decide();
      }
    }

    clampDuck();

    if (duck.tripCooldown <= 0 && !duck.dragged && duck.brain !== "flee" && duck.brain !== "brave" && duck.brain !== "protest") {
      for (const log of logs) {
        if (logCollide(duck.x, duck.y, log, 12)) {
          const ang = Math.atan2(duck.y - log.y, duck.x - log.x);
          duck.x += Math.cos(ang) * 22;
          duck.y += Math.sin(ang) * 22;
          clampDuck();
          tripOverLog();
          break;
        }
      }
    }

    if (duck.tripping <= 0) {
      for (let i = 0; i < pellets.length; i++) {
        const p = pellets[i];
        if (Math.hypot(duck.x - p.x, duck.y - p.y) < 30) {
          score++;
          gainXP(1);
          say(pick(EAT_WORDS));
          playQuack();
          duck.eggCounter++;
          if (duck.eggCounter >= 2) {
            duck.eggCounter = 0;
            layEgg();
          }
          pellets[i] = spawnPellet();
          for (let j = 0; j < 7; j++) {
            particles.push({
              type: "spark",
              x: p.x,
              y: p.y,
              vx: rand(-90, 90),
              vy: rand(-110, -10),
              life: rand(0.3, 0.6),
              color: pick(["#ffd93d", "#ffb347", "#fff3b0"]),
              size: rand(2, 4)
            });
          }
          particles.push({ type: "ring", x: p.x, y: p.y, life: 0.4, color: "#ffffff", size: 6 });
          if (score >= goal) {
            stageClear();
          }
        }
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.type === "spark") {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 300 * dt;
    } else if (p.type === "ring") {
      p.size += 90 * dt;
    } else if (p.type === "zzz") {
      p.y -= 26 * dt;
      p.x += Math.sin(time * 4 + p.life * 5) * 14 * dt;
    } else if (p.type === "word") {
      p.y -= 22 * dt;
    } else if (p.type === "heart") {
      p.y -= 45 * dt;
      p.x += Math.sin(time * 6 + p.life * 7) * 20 * dt;
    } else if (p.type === "twinkle") {
      p.y += 24 * dt;
      p.x += Math.sin(time * 3 + p.seed) * 12 * dt;
    } else if (p.type === "fish") {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 500 * dt;
    }
    p.life -= dt;
    if (p.life <= 0 && p.type !== "confetti") particles.splice(i, 1);
  }
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
    const a2 = a + Math.PI / 5;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.lineTo(x + Math.cos(a2) * r * 0.45, y + Math.sin(a2) * r * 0.45);
  }
  ctx.closePath();
  ctx.fill();
}

  }

  if (th.night) {
    ctx.fillStyle = "#fff";
    for (let i = 0; i < 26; i++) {
      const sx = (i * 137 + 40) % W;
      const sy = (i * 71 + 20) % 200;
      ctx.globalAlpha = 0.35 + 0.55 * Math.abs(Math.sin(time * 1.5 + i));
      ctx.beginPath();
      ctx.arc(sx, sy, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = th.sun;
    ctx.beginPath();
    ctx.arc(700, 82, 34, 0, Math.PI * 2);
    ctx.fill();
