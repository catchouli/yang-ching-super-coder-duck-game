    ctx.arc(690, 74, 7, 0, Math.PI * 2);
    ctx.arc(710, 92, 5, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const hype = sunHype > 0;
    const popT = hype ? Math.min(1, (6 - sunHype) / 0.6) : 0;
    const sunR = 38 * (1 + Math.sin(popT * Math.PI) * 0.22 + (hype ? Math.sin(time * 7) * 0.05 : 0));
    const sunCol = hype ? "hsl(" + Math.round((time * 90) % 360) + ", 85%, 65%)" : th.sun;
    const rayCol = hype ? "hsl(" + Math.round((time * 90 + 40) % 360) + ", 85%, 60%)" : th.sun;
    ctx.fillStyle = sunCol;
    ctx.beginPath();
    ctx.arc(700, 82, sunR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rayCol;
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    const raySpeed = hype ? 1.8 : 0.15;
    for (let i = 0; i < 12; i++) {
      const a = time * raySpeed + (i * Math.PI) / 6;
      const len = hype ? 12 + Math.sin(time * 9 + i) * 5 : 12;
      ctx.beginPath();
      ctx.moveTo(700 + Math.cos(a) * (sunR + 10), 82 + Math.sin(a) * (sunR + 10));
      ctx.lineTo(700 + Math.cos(a) * (sunR + 22 + len), 82 + Math.sin(a) * (sunR + 22 + len));
      ctx.stroke();
    }
    if (hype) {
      ctx.strokeStyle = "hsl(" + Math.round((time * 90 + 80) % 360) + ", 85%, 70%)";
      ctx.globalAlpha = 0.45;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(700, 82, sunR + 14 + Math.sin(time * 3) * 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(-12 + 700, 76, 5, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(12 + 700, 76, 5, Math.PI, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(700, 80, 13, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,120,120,0.5)";
      ctx.beginPath();
      ctx.arc(682, 90, 5, 0, Math.PI * 2);
      ctx.arc(718, 90, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (const c of clouds) {
    ctx.fillStyle = c.rain > 0 ? "rgba(140,150,175,0.95)" : th.night ? "rgba(200,210,230,0.5)" : "rgba(255,255,255,0.92)";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x + 26 * c.s, c.y + 6 * c.s, 18 * c.s, 0, Math.PI * 2);
    ctx.arc(c.x - 26 * c.s, c.y + 6 * c.s, 16 * c.s, 0, Math.PI * 2);
    ctx.fill();
  }

  const p = pondInfo();
  ctx.fillStyle = th.water;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, p.rx, p.ry, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = th.waterLine;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(p.x - 25, p.y - 8, 18, 5, -0.2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.ellipse(p.x + 30, p.y + 12, 24, 6, 0.15, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = "#3e9e4f";
  ctx.beginPath();
  ctx.ellipse(p.x + 45, p.y - 15, 16, 8, 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ff8fb1";
  ctx.beginPath();
  ctx.arc(p.x + 45, p.y - 19, 4, 0, Math.PI * 2);
  ctx.fill();

  if (th.name === "WINTER" && snowman) {
    const sm = snowman;
    const angry = sm.state === "angry";
    const shakeX = angry ? Math.sin(time * 30) * 1.5 : 0;
    const tilt = angry ? Math.sin(time * 8) * 0.08 : 0;
    ctx.fillStyle = "rgba(0,0,0,0.08)";
    ctx.beginPath();
    ctx.ellipse(sm.x, sm.y + 34, 34, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(sm.x + shakeX, sm.y);
    ctx.rotate(tilt);
    ctx.fillStyle = "#fff";
    ctx.strokeStyle = "#c8d4dc";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -42, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(-6, -46, 2.2, 0, Math.PI * 2);
    ctx.arc(6, -46, 2.2, 0, Math.PI * 2);
    ctx.fill();
    if (angry) {
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-11, -54);
      ctx.lineTo(-3, -50);
      ctx.moveTo(11, -54);
      ctx.lineTo(3, -50);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -35, 4.5, Math.PI * 1.15, Math.PI * 1.85);
      ctx.stroke();
      ctx.strokeStyle = "#e63946";
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 4; i++) {
        const aa = (i * Math.PI) / 2 + Math.PI / 4 + Math.sin(time * 12) * 0.15;
        ctx.beginPath();
        ctx.moveTo(26 + Math.cos(aa) * 4, -60 + Math.sin(aa) * 4);
        ctx.lineTo(26 + Math.cos(aa) * 9, -60 + Math.sin(aa) * 9);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = "#333";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, -36, 5, Math.PI * 0.2, Math.PI * 0.8);
      ctx.stroke();
    }
    ctx.fillStyle = "#ff8c42";
    ctx.beginPath();
    ctx.moveTo(0, -42);
    ctx.lineTo(16, -40);
    ctx.lineTo(0, -38);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#333";
    ctx.beginPath();
    ctx.arc(0, -8, 2.2, 0, Math.PI * 2);
    ctx.arc(0, 2, 2.2, 0, Math.PI * 2);
    ctx.arc(0, 12, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#7a4a21";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-24, -10);
    ctx.lineTo(-44, -22);
    ctx.moveTo(24, -10);
    ctx.lineTo(44, -20);
    ctx.stroke();
    ctx.fillStyle = "#e63946";
    ctx.fillRect(-14, -30, 28, 7);
    ctx.fillRect(-6, -26, 8, 14);
    ctx.restore();
  }

  if (th.name !== "WINTER" && th.name !== "NIGHT") {
    for (const f of flowers) {
      const g = f.grow;
      const h = 6 + g * 20;
      const sway = Math.sin(time * 1.5 + f.phase) * g * 2;
      const topX = f.x + sway;
      const topY = f.y - h;
      ctx.strokeStyle = "#3e7a2e";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.quadraticCurveTo(f.x + sway * 0.5, f.y - h * 0.5, topX, topY);
      ctx.stroke();
      if (g > 0.35) {
        ctx.fillStyle = "#4c9a3d";
        const lx = f.x + (topX - f.x) * 0.55;
        const ly = f.y - h * 0.55;
        const ls = Math.min(1, g * 1.6);
        ctx.beginPath();
        ctx.ellipse(lx - 4, ly, 4 * ls, 2, -0.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(lx + 4, ly - 3, 4 * ls, 2, 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (g < 0.55) {
        ctx.fillStyle = "#4c9a3d";
        ctx.beginPath();
        ctx.arc(topX, topY, 3, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const ps = Math.min(1, (g - 0.55) / 0.45);
        ctx.fillStyle = f.petal;
        for (let i = 0; i < 5; i++) {
          const a = (i * Math.PI * 2) / 5 + 0.3;
          ctx.beginPath();
          ctx.arc(topX + Math.cos(a) * 5 * ps, topY + Math.sin(a) * 5 * ps, 4 * ps, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "#ffd93d";
        ctx.beginPath();
        ctx.arc(topX, topY, 3.5 * ps, 0, Math.PI * 2);
        ctx.fill();
        if (f.puff > 0) {
          ctx.globalAlpha = Math.max(0, f.puff);
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(topX, topY, 8 + (0.9 - f.puff) * 22, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  drawWeather();
}

function drawLogs() {
  for (const log of logs) {
    ctx.save();
    ctx.translate(log.x, log.y);
    ctx.rotate(log.tilt);
    ctx.fillStyle = "rgba(0,0,0,0.12)";
    ctx.beginPath();
    ctx.ellipse(0, log.ry + 10, log.rx + 4, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#8b5a2b";
    roundRectPath(-log.rx, -log.ry, log.rx * 2, log.ry * 2, log.ry * 0.8);
    ctx.fill();
    ctx.strokeStyle = "#6b4420";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.strokeStyle = "#74491f";
    ctx.lineWidth = 2;
    for (let i = 0; i < log.rings; i++) {
      const yy = -log.ry + 8 + i * ((log.ry * 2 - 16) / Math.max(1, log.rings - 1));
      const span = log.rx * 2 - 50;
      const dashX = -log.rx + 25 + ((((log.roll * 20 + i * 57) % span) + span) % span);
      ctx.beginPath();
      ctx.moveTo(dashX - 11, yy);
      ctx.lineTo(dashX + 11, yy);
      ctx.stroke();
    }
    ctx.fillStyle = "#c89b6a";
    ctx.beginPath();
    ctx.ellipse(log.rx - 14, 0, 10, log.ry - 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#8b5a2b";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.strokeStyle = "#9c7146";
    ctx.beginPath();
    ctx.ellipse(log.rx - 14, 0, 5, log.ry * 0.35, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(log.rx - 14, 0, 2, log.ry * 0.15, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.save();
    ctx.translate(log.rx - 14, 0);
    ctx.rotate(log.roll);
    ctx.strokeStyle = "#8b5a2b";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, -log.ry * 0.55);
    ctx.lineTo(0, log.ry * 0.55);
    ctx.moveTo(-6, 0);
    ctx.lineTo(6, 0);
    ctx.stroke();
    ctx.restore();
    ctx.restore();
  }
}

function drawDuck() {
  const spin = duck.tripping > 0 ? (1 - duck.tripping) * Math.PI * 2 : duck.spinning ? duck.spinA : 0;
  const tilt = duck.tripping > 0 || duck.spinning ? spin : duck.moving ? Math.sin(duck.waddlePhase) * 0.13 : Math.sin(time * 2) * 0.03;
  let bob = duck.moving ? Math.abs(Math.cos(duck.waddlePhase)) * 3 : Math.sin(time * 2) * 1.2;
  if (duck.brain === "drink") bob += Math.abs(Math.sin(time * 6)) * 5;
  if (duck.hop > 0) bob -= Math.sin((1 - duck.hop / 0.5) * Math.PI) * 22;

  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.ellipse(duck.x, duck.y + 27, 23, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(duck.x, duck.y - bob);
  ctx.rotate(tilt);
  const duckScale = 1 + (save.level - 1) * 0.05;
  ctx.scale(duck.facing * duckScale, duckScale);

  const footA = duck.moving ? Math.sin(duck.waddlePhase) * 5 : 0;
  const footB = duck.moving ? -Math.sin(duck.waddlePhase) * 5 : 0;
  ctx.fillStyle = "#ff9f1c";
  ctx.beginPath();
  ctx.ellipse(-6, 19 + footA, 6, 3.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(6, 19 + footB, 6, 3.2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#f0b429";
  ctx.beginPath();
  ctx.moveTo(-18, -4);
  ctx.lineTo(-33, -15);
  ctx.lineTo(-22, 5);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffd93d";
  ctx.beginPath();
  ctx.ellipse(0, 0, 22, 17, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#d9a616";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.save();
  ctx.translate(-2, 3);
  ctx.rotate(-0.35 + Math.sin(duck.waddlePhase) * 0.12);
  ctx.fillStyle = "#f7c948";
  ctx.beginPath();
  ctx.ellipse(0, 0, 11, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#d9a616";
  ctx.stroke();
  ctx.restore();

  const headBob = Math.sin(duck.waddlePhase) * 1.5;
  ctx.fillStyle = "#ffd93d";
  ctx.beginPath();
  ctx.arc(14, -19 + headBob, 12.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#d9a616";
  ctx.stroke();

  const happy = duck.happyTimer > 0;
  if (happy) {
    ctx.fillStyle = "#ff9f1c";
    ctx.beginPath();
    ctx.moveTo(24, -22 + headBob);
    ctx.lineTo(40, -17 + headBob);
    ctx.lineTo(24, -13 + headBob);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#e8890c";
    ctx.beginPath();
    ctx.moveTo(24, -13 + headBob);
    ctx.lineTo(36, -11.5 + headBob);
    ctx.lineTo(24, -9 + headBob);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = "#ff9f1c";
    ctx.beginPath();
    ctx.moveTo(24, -22 + headBob);
    ctx.lineTo(39, -16 + headBob);
    ctx.lineTo(24, -12 + headBob);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#d97f0e";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  ctx.fillStyle = happy ? "rgba(255,110,110,0.6)" : "rgba(255,130,130,0.45)";
  ctx.beginPath();
  ctx.ellipse(11, -11 + headBob, happy ? 5 : 4, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();

  const eyesClosed = duck.blinking > 0 || duck.brain === "nap";
  if (happy && !eyesClosed) {
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(17, -21 + headBob, 3.2, Math.PI, Math.PI * 2);
    ctx.stroke();
  } else if (eyesClosed) {
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(14, -21 + headBob);
    ctx.lineTo(20, -21 + headBob);
    ctx.stroke();
  } else {
    ctx.fillStyle = "#2b2b2b";
    ctx.beginPath();
    ctx.arc(17, -22 + headBob, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(18.2, -23.2 + headBob, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  if (duck.hat) {
    ctx.save();
    ctx.translate(14, -31 + headBob);
    drawHatShape(duck.hat);
    ctx.restore();
  }
  ctx.restore();

  if (duck.tripping > 0.35) {
    for (let i = 0; i < 3; i++) {
      const a = duck.dizzyAngle + (i * Math.PI * 2) / 3;
      ctx.fillStyle = "#ffe066";
      drawStar(duck.x + Math.cos(a) * 26, duck.y - 58 + Math.sin(a) * 8, 6);
    }
  }

  if (duck.bubbleTimer > 0) {
    bubbleQueue.push({ x: duck.x, top: duck.y - 92, text: duck.bubbleText, font: "bold 18px 'Comic Sans MS', 'Chalkboard SE', cursive" });
  }
}

function drawSpeechBubble(b) {
  ctx.font = b.font;
  const lines = Array.isArray(b.text) ? b.text : [b.text];
  let lw = 0;
  for (const l of lines) lw = Math.max(lw, ctx.measureText(l).width);
  const lineH = b.lineH || 20;
  const w = lw + (b.pad !== undefined ? b.pad * 2 : 24);
  const h = b.h || lines.length * lineH + 10;
  const bx = Math.max(6, Math.min(W - 6 - w, b.x - w / 2));
  const by = b.top;
  ctx.fillStyle = b.bg || "rgba(255,255,255,0.95)";
  roundRectPath(bx, by, w, h, 10);
  ctx.fill();
  ctx.strokeStyle = b.border || "#333";
  ctx.lineWidth = b.bw || 2;
  ctx.stroke();
  const tailX = Math.max(bx + 14, Math.min(bx + w - 14, b.x));
  ctx.fillStyle = b.bg || "rgba(255,255,255,0.95)";
  ctx.beginPath();
  ctx.moveTo(tailX - 7, by + h - 1);
  ctx.lineTo(tailX, by + h + 13);
  ctx.lineTo(tailX + 7, by + h - 1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = b.border || "#333";
  ctx.stroke();
  ctx.fillStyle = b.color || "#333";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  lines.forEach((l, i) => {
    ctx.fillText(l, bx + w / 2, by + 5 + lineH * i + lineH / 2);
  });
  ctx.textAlign = "left";
  ctx.textBaseline = "top";
}

function drawBubbleLayer() {
  for (const b of bubbleQueue) drawSpeechBubble(b);
  bubbleQueue = [];
  for (const p of particles) {
    if (p.type !== "word") continue;
    ctx.globalAlpha = Math.max(0, p.life / 1.2);
    ctx.font = "bold 14px 'Comic Sans MS', 'Chalkboard SE', cursive";
    ctx.textAlign = "center";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#fff";
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = "#d97f0e";
    ctx.fillText(p.text, p.x, p.y);
    ctx.textAlign = "left";
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    if (p.type === "word") continue;
    if (p.type === "spark") {
      ctx.globalAlpha = Math.max(0, p.life * 2) * (0.7 + 0.3 * Math.sin(time * 40 + p.x * 7));
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === "flash") {
      ctx.globalAlpha = Math.max(0, p.life / 0.3) * 0.85;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + (0.3 - p.life) * 500, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === "twinkle") {
      const flick = 0.4 + 0.6 * Math.abs(Math.sin(time * 22 + p.seed * 3));
      ctx.globalAlpha = Math.max(0, p.life / 1.4) * flick;
      ctx.fillStyle = p.color;
      drawStar(p.x, p.y, p.size);
    } else if (p.type === "fish") {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath();
      ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#ff7b1c";
      ctx.beginPath();
      ctx.moveTo(-7, 0);
      ctx.lineTo(-12, -4);
      ctx.lineTo(-12, 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#2b2b2b";
      ctx.beginPath();
      ctx.arc(4, -1, 1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (p.type === "ring") {
      ctx.globalAlpha = Math.max(0, p.life * 1.6);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.type === "zzz") {
      const age = 1.6 - p.life;
      ctx.globalAlpha = Math.max(0, p.life / 1.6);
      ctx.fillStyle = "#6a5acd";
      ctx.font = "bold " + (12 + age * 8) + "px 'Comic Sans MS', 'Chalkboard SE', cursive";
      ctx.fillText("z", p.x, p.y);
    } else if (p.type === "word") {
      ctx.globalAlpha = Math.max(0, p.life / 1.2);
      ctx.font = "bold 14px 'Comic Sans MS', 'Chalkboard SE', cursive";
      ctx.textAlign = "center";
      ctx.lineWidth = 3;
      ctx.strokeStyle = "#fff";
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = "#d97f0e";
      ctx.fillText(p.text, p.x, p.y);
      ctx.textAlign = "left";
    } else if (p.type === "heart") {
      ctx.globalAlpha = Math.max(0, p.life / 1.3);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(p.size, p.size);
      ctx.fillStyle = "#ff6b9d";
      ctx.beginPath();
      ctx.arc(-2.4, -1.2, 2.6, 0, Math.PI * 2);
      ctx.arc(2.4, -1.2, 2.6, 0, Math.PI * 2);
      ctx.moveTo(-4.8, -0.4);
      ctx.lineTo(4.8, -0.4);
      ctx.lineTo(0, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    } else if (p.type === "confetti") {
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
}

function statusText() {
  if (duck.tripping > 0) return "WHOOPS! tripped over a log";
  switch (duck.brain) {
    case "seek": return "hunting for pellets";
    case "wander": return "waddling around";
    case "pond": return "going for a sip";
    case "drink": return "sipping... glug glug";
    case "nap": return "napping... zzz";
    case "chase": return "CHASING THE BUTTERFLY!";
    case "toRide": return rideForStage(stage) === "coaster" ? "going to the EGG COASTER!" : "going to the " + rideForStage(stage).toUpperCase() + "!";
    case "ride": return "RIDING THE EGG COASTER! WHEEE!";

    ctx.fillStyle = "rgba(60, 0, 0, 0.85)";
    roundRectPath(-330, -66, 660, 132, 14);
    ctx.fill();
    ctx.strokeStyle = "#ff3b3b";
    ctx.lineWidth = 4;

  if (fineMsg > 0) {

    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(255, 255, 255, 0.94)";
    roundRectPath(W / 2 - 260, 190, 520, 118, 12);
    ctx.fill();
    ctx.strokeStyle = "#1c3f6e";
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 20px 'Comic Sans MS', 'Chalkboard SE', cursive";
    ctx.fillStyle = "#1c3f6e";
    ctx.fillText("~~~ OVERFISHING NOTICE ~~~", W / 2, 216);
    ctx.font = "bold 17px 'Comic Sans MS', 'Chalkboard SE', cursive";
    ctx.fillStyle = "#b02020";
    ctx.fillText("YOU HAVE BEEN FINED 5 DOLLARS", W / 2, 248);
    ctx.fillText("FOR OVERFISHING.", W / 2, 274);
    ctx.save();
    ctx.translate(W / 2 + 175, 236);
    ctx.rotate(-0.3);
    ctx.strokeStyle = "rgba(200, 30, 30, 0.85)";
    ctx.lineWidth = 3;
    roundRectPath(-46, -17, 92, 34, 6);
    ctx.stroke();
    ctx.fillStyle = "rgba(200, 30, 30, 0.85)";
    ctx.font = "bold 20px 'Comic Sans MS', 'Chalkboard SE', cursive";
    ctx.fillText("FINED", 0, 1);
    ctx.restore();
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.globalAlpha = 1;
  }
  drawBubbleLayer();
  if (teslaPitch > 0) {
    const a = Math.max(0, Math.min(1, teslaPitch * 2, (4.5 - teslaPitch) * 3));
    ctx.globalAlpha = a;
    drawSpeechBubble({ x: teslaX, top: teslaY - 46, text: ["Buy a new Tesla", "Model 3 Roadster today!!!!"], font: "bold 15px 'Comic Sans MS', 'Chalkboard SE', cursive", lineH: 18, border: "#b8860b", color: "#8a5a00" });
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
  actxInit();
  const k = e.key.toLowerCase();
  if (k === " " || k === "enter") e.preventDefault();
  if (k === "m") muted = !muted;
  if (k === "r") tryResetLevel();
  if (state === "clear" && k === " ") clearTimer = 0;
});

function wordAt(text, x, y) {
  particles.push({ type: "word", text, x, y, life: 1.2 });
}

function hitTest(x, y) {
  if (Math.hypot(x - 700, y - 82) < 58) return { kind: "sun" };
  if (matrixMode > 0 && !keanuGone && !keanuFly && Math.hypot(x - 400, y - 430) < 62) return { kind: "keanu" };
  if (theme().name === "WINTER" && snowman && snowman.state === "calm" && Math.hypot(x - snowman.x, y - (snowman.y - 20)) < 48) return { kind: "snowman" };
  for (const fw of fireworks) {
    if (fw.state === "idle" && Math.hypot(x - fw.x, y - fw.y) < 30) return { kind: "firework", fw };
  }
  {
    const p = pondInfo();
    const dx = (x - p.x) / p.rx;
    const dy = (y - p.y) / p.ry;
    if (dx * dx + dy * dy < 1) return { kind: "pond" };
  }
  for (const log of logs) {
    if (logCollide(x, y, log, 8)) return { kind: "log", log };
  }
  for (const tr of trees) {
    if (tr.state === "alive" && Math.hypot(x - tr.x, y - (tr.y - 45)) < 62) return { kind: "tree", tree: tr };
  }
  if (bulldozer && Math.hypot(x - bulldozer.x, y - bulldozer.y + 10) < 78) return { kind: "bulldozer" };
  for (const egg of eggs) {
    if (Math.hypot(x - egg.x, y - egg.y) < 16) return { kind: "egg", egg };
  }
  for (const fr of frogs) {
    if (Math.hypot(x - fr.x, y - fr.y + 6) < 24) return { kind: "frog", fr };
  }
  if (goose && Math.hypot(x - goose.x, y - goose.y + 5) < 46) return { kind: "goose" };
  if (wizard && Math.hypot(x - wizard.x, y - wizard.y + 10) < 30) return { kind: "wizard" };
  for (const v of visitors) {
    if (Math.hypot(x - v.x, y - v.y + 6) < 26) return { kind: "visitor", v };
  }
  if (Math.hypot(x - butterfly.x, y - butterfly.y) < 20) return { kind: "butterfly" };
  if (elon && Math.hypot(x - elon.x, y - elon.y) < 85) return { kind: "elon" };
  if (maisy && Math.hypot(x - maisy.x, y - maisy.y) < 88) return { kind: "maisy" };
  if (dad && Math.hypot(x - dad.x, y - dad.y + 30) < 52) return { kind: "dad" };
  for (const fl of flocks) {
    for (const b of fl.birds) {
      if (Math.hypot(x - b.x, y - b.y) < 18) return { kind: "bird", fl };
    }
  }
  if (gnome && Math.hypot(x - gnome.x, y - gnome.y + 14) < 28) return { kind: "gnome" };
  for (const dl of ducklings) {
    if (!dl.mode && Math.hypot(x - dl.x, y - dl.y) < 20) return { kind: "duckling", dl };
  }
  for (const c of clouds) {
    if (Math.hypot(x - c.x, y - c.y) < 32) return { kind: "cloud", c };
  }
  for (let i = 0; i < pellets.length; i++) {
    if (Math.hypot(x - pellets[i].x, y - pellets[i].y) < 13) return { kind: "pellet", idx: i };
  }
  if (Math.hypot(x - duck.x, y - (duck.y - 5)) < 42) return { kind: "duck" };
  return null;
}

canvas.addEventListener("mousemove", (e) => {
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  mouseX = x;
  mouseY = y;
  if (pickedFlower) {
    pickedFlower.x = x;
    pickedFlower.y = y;
    canvas.style.cursor = "grabbing";
    return;
  }
  let overFlower = false;
  for (const f of flowers) {
    if (f.grow < 0.85) continue;
    const h = 6 + f.grow * 20;
    const sway = Math.sin(time * 1.5 + f.phase) * f.grow * 2;
    if (Math.hypot(x - (f.x + sway), y - (f.y - h)) < 22) overFlower = true;
  }
  canvas.style.cursor = overFlower || hitTest(x, y) ? "pointer" : "default";
});

canvas.addEventListener("mousedown", (e) => {
  if (state !== "play") return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  if (Math.hypot(x - duck.x, y - (duck.y - 5)) < 42) {
    draggingDuck = true;
    duck.dragged = true;
    duck.moving = false;
    say("QUACK?!");
    playQuack();
    canvas.style.cursor = "grabbing";
    return;
  }
  for (const f of flowers) {
    if (f.grow < 0.85) continue;
    const h = 6 + f.grow * 20;
    const sway = Math.sin(time * 1.5 + f.phase) * f.grow * 2;
    if (Math.hypot(x - (f.x + sway), y - (f.y - h)) < 22) {
      pickedFlower = { f, x, y };
      canvas.style.cursor = "grabbing";
      return;
    }
  }
});

canvas.addEventListener("mouseup", (e) => {
  if (draggingDuck) {
    draggingDuck = false;
    duck.dragged = false;
    duck.hop = 0.4;
    duck.brain = "idle";
    duck.stateTimer = 1;
    say(pick(["WHEE!", "WHAT A RIDE!", "QUACK!"]));
    canvas.style.cursor = "default";
    return;
  }
  if (!pickedFlower) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  const f = pickedFlower.f;
  flowers.splice(flowers.indexOf(f), 1);
  pickedFlower = null;
  if (Math.hypot(x - duck.x, y - (duck.y - 10)) < 55) {
    giveFlower();
  } else if (!nearPond(x, y, 10)) {
    flowers.push({ x, y: Math.min(H - 20, y), petal: f.petal, grow: 0.85, puff: 0, phase: rand(0, 6.28) });
  }
});

canvas.addEventListener("click", (e) => {
  actxInit();
  if (state !== "play") return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width / r.width);
  const y = (e.clientY - r.top) * (canvas.height / r.height);
  const hit = hitTest(x, y);
  if (!hit) return;
  switch (hit.kind) {
    case "keanu":
      bubbleQueue.push({ x: 400, top: 296, text: "THE ONE PIECE IS REALLLLLL!!!", font: "bold 18px monospace", bg: "rgba(0, 20, 0, 0.92)", border: "#33dd55", color: "#66ff77", bw: 2.5, pad: 12 });
      playMatrix();
      playWhee();
      keanuFly = 1.2;
      matrixMode = Math.min(matrixMode, 1.7);
      break;
    case "sun":
      sunHype = 6;
      playWhee();
      for (let i = 0; i < 10; i++) {
        particles.push({
          type: "twinkle",
          x: 700 + rand(-70, 70),
          y: 82 + rand(-70, 70),
          life: rand(0.6, 1.1),
          color: "hsl(" + Math.round(rand(0, 360)) + ", 85%, 70%)",
          size: rand(2.5, 4.5),
          seed: rand(0, 10)
        });
      }
      break;
    case "snowman":
      snowman.state = "angry";
      snowman.timer = 8;
      playBonk();
      wordAt("GRRR!!", snowman.x, snowman.y - 70);
      break;
    case "firework":
      hit.fw.state = "rising";
      hit.fw.vy = -330;
      hit.fw.ceil = Math.max(70, hit.fw.y - rand(150, 280));
      playPeep();
      break;
    case "pond": {
      const p = pondInfo();
      for (let i = 0; i < 14; i++) {
        particles.push({ type: "fish", x: p.x + rand(-45, 45), y: p.y + rand(-12, 12), vx: rand(-170, 170), vy: rand(-280, -120), life: 1.3 });
      }
      for (let i = 0; i < 3; i++) {
        particles.push({ type: "ring", x: p.x + rand(-40, 40), y: p.y + rand(-15, 15), life: 0.6, color: "#bfe8ff", size: 6 });
      }
      for (let i = 0; i < 8; i++) {
        particles.push({ type: "spark", x: p.x + rand(-40, 40), y: p.y, vx: rand(-80, 80), vy: rand(-150, -60), life: 0.5, color: "#bfe8ff", size: rand(2, 3.5) });
      }
      playPlop();
      playPeep();
      wordAt("SPLASH!", x, y - 24);
      if (pondCooldown <= 0) {
        pondHits++;
        if (pondHits >= 5) {
          pondHits = 0;
          fineMsg = 6;
          pondCooldown = 60;
        }
      }
      break;
    }
    case "log":
      hit.log.v = 520;
      wordAt("ZOOM!", hit.log.x, hit.log.y - 40);
      playPeep();
      for (let i = 0; i < 6; i++) {
        particles.push({ type: "spark", x: hit.log.x, y: hit.log.y + 20, vx: rand(-60, 60), vy: rand(-70, -10), life: 0.4, color: "#c9b894", size: rand(2, 4) });
      }
      break;
    case "tree": {
      const tr = hit.tree;
      tr.chop++;
      tr.shake = 0.3;
      playBonk();
      wordAt("CHOP!", tr.x, tr.y - 85);
      for (let i = 0; i < 6; i++) {
        particles.push({ type: "spark", x: tr.x + rand(-12, 12), y: tr.y - rand(30, 55), vx: rand(-60, 60), vy: rand(-80, -20), life: 0.5, color: pick(["#c9b894", "#8b5a2b"]), size: rand(2, 3.5) });
      }
      if (tr.chop >= 2) {
        tr.state = "falling";
        tr.t = 0;
        tr.fallDir = Math.random() < 0.5 ? 1 : -1;
        ecoMsg = 6.5;
        say(pick(["OH NO! THE TREES!", "NOT THE FOREST!"]));
      }
      break;
    }
    case "bulldozer":
      if (bulldozer.state !== "fleeing") {
        bulldozer.state = "fleeing";
        bulldozer.fleeClicks = 0;
        ecoRush = 999;
        say(pick(["GET HIM!", "SAVE THE TREES!", "CHAAARGE!"]));
        playHonk();
        playWhee();
      } else {
        bulldozer.fleeClicks++;
      }
      break;
    case "egg":
      hit.egg.hatching = true;
      hit.egg.timer = 1.49;
      playPeep();
      break;
    case "frog": {
      const fr = hit.fr;
      fr.croak = 0.9;
      wordAt("ribbit!!", fr.x, fr.y - 34);
      playRibbit();
      const spot = frogSpot();
      fr.fromX = fr.x;
      fr.fromY = fr.y;
      fr.toX = spot.x;
      fr.toY = spot.y;
      fr.hopT = 0;
      fr.state = "hop";
      fr.dir = fr.toX >= fr.x ? 1 : -1;
      break;
    }
    case "goose":
      playHonk();
      wordAt("HONK!!", goose.x, goose.y - 50);
      if (goose.state !== "clickedFlee") {
        goose.resume = goose.state;
        goose.state = "clickedFlee";
        goose.timer = 1.5;
      }
      break;
    case "wizard":
      wizard.tickles = (wizard.tickles || 0) + 1;
      if (wizard.tickles >= 3 && spellMode <= 0) {
        wizard.tickles = 0;
        wizard.giggle = 0;
        spellMode = 5;
        shake = 0.5;
        playMatrix();
        playJingle();
        wordAt(pick(["WIBBLY WOBBLY WONDEROUS!!", "ABRA-KA-DUCK-BRA!!", "HOCUS POCUS PECULIARUS!!"]), wizard.x, wizard.y - 76);
        for (let i = 0; i < 24; i++) {
          particles.push({
            type: "twinkle",
            x: wizard.x + rand(-40, 40),
            y: wizard.y + rand(-70, 30),
            life: rand(0.5, 1.1),
            color: pick(["#b388ff", "#ffd93d", "#5bc0eb", "#ff8fb1", "#fff"]),
            size: rand(2, 5),
            seed: rand(0, 10)
          });
        }
        particles.push({ type: "flash", x: wizard.x, y: wizard.y - 30, life: 0.3, size: 14 });
      } else {
        wizard.giggle = 2;
        wizard.giggleLine = pick(["AHAHA!! STOP!!", "HEHEHE!! THAT TICKLES!!", "HEE HEE!! NO MORE!!"]);
        playPeep();
        playPeep();
        for (let i = 0; i < 8; i++) {
          particles.push({
            type: "twinkle",
            x: wizard.x + rand(-26, 26),
            y: wizard.y + rand(-60, 20),
            life: rand(0.4, 0.9),
            color: pick(["#b388ff", "#e1bee7", "#fff"]),
            size: rand(2, 4),
            seed: rand(0, 10)
          });
        }
      }
      break;
    case "visitor":
      hit.v.chase = 6;
      hit.v.state = "chase";
      playPeep();
      wordAt("^_^", hit.v.x, hit.v.y - 36);
      for (let i = 0; i < 4; i++) {
        particles.push({ type: "heart", x: hit.v.x + rand(-10, 10), y: hit.v.y - 24, life: rand(0.8, 1.2), size: rand(0.7, 1.1) });
      }
      break;
    case "butterfly":
      butterfly.ang = rand(0, Math.PI * 2);
      for (let i = 0; i < 6; i++) {
        particles.push({ type: "spark", x: butterfly.x, y: butterfly.y, vx: rand(-70, 70), vy: rand(-70, 70), life: 0.5, color: pick(["#ff8fb1", "#d9b3ff", "#fff"]), size: rand(2, 3.5) });
      }
      break;
    case "elon":
      playHonk();
      teslaPitch = 4.5;
      teslaX = x;
      teslaY = y;
      for (let i = 0; i < 6; i++) {
        particles.push({
          type: "twinkle",
          x: elon.x + rand(-70, 70),
          y: elon.y + rand(-40, 10),
          life: rand(0.4, 0.8),
          color: pick(["#ffd93d", "#fff", "#bfe3f2"]),
          size: rand(2, 4),
          seed: rand(0, 10)
        });
      }
      if (dad) {
        wordAt("THE ONE I WANT!!", dad.x, dad.y - 100);
        particles.push({ type: "heart", x: dad.x, y: dad.y - 62, life: 1.3, size: 1.3 });
        playJingle();
      }
      break;
    case "maisy":
      playJingle();
      wordAt("TOOT TOOT!", maisy.x, maisy.y - 84);
      break;
    case "dad":
      playJingle();
      wordAt("^_^", dad.x, dad.y - 95);
      particles.push({ type: "heart", x: dad.x + rand(-10, 10), y: dad.y - 64, life: 1.2, size: 1.2 });
      break;
    case "bird":
      hit.fl.cursor = 8;
      playPeep();
      for (let i = 0; i < 5; i++) {
        particles.push({ type: "spark", x: hit.fl.birds[0].x, y: hit.fl.birds[0].y, vx: rand(-60, 60), vy: rand(-60, 60), life: 0.5, color: "#bfe3f2", size: rand(2, 3) });
      }
      break;
    case "gnome":
      gnome.line = "stay away from me lucky charms!!!!";
      gnome.talkTimer = 1e9;
      gnome.boost = 2;
      playPeep();
      wordAt("!!", gnome.x, gnome.y - 58);
      break;
    case "duckling":
      playPeep();
      playWhee();
      hit.dl.zoomies = 2.5;
      hit.dl.zt = 0;
      wordAt("ZOOMIES!", hit.dl.x, hit.dl.y - 34);
      particles.push({ type: "heart", x: hit.dl.x, y: hit.dl.y - 20, life: 1, size: 1 });
      break;
    case "cloud":
      hit.c.rain = 1.6;
      playPlop();
      break;
    case "pellet":
      pellets[hit.idx] = spawnPellet();
      playPeep();
      wordAt("NOM!", x, y - 10);
      for (let i = 0; i < 6; i++) {
        particles.push({ type: "spark", x, y, vx: rand(-70, 70), vy: rand(-90, -20), life: 0.4, color: "#ffd93d", size: rand(1.5, 3) });
      }
      break;
    case "duck":
      petDuck();
      break;
  }
});

reset();
requestAnimationFrame(loop);

function bubbleize(id, colors) {
  const el = document.getElementById(id);
  const text = el.textContent;
  el.textContent = "";
  [...text].forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch === " " ? "\u00A0" : ch;
    s.style.setProperty("--i", i);
    if (ch !== " ") s.style.color = colors[i % colors.length];
    el.appendChild(s);
  });
}
bubbleize("title", ["#ff5fa8", "#ffd93d", "#5bc0eb", "#7ec850", "#ff9f1c", "#d9b3ff"]);
bubbleize("subtitle", ["#ffffff", "#ffe9a8"]);
